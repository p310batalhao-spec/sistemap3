<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento P3 - OPO Interativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <style>
        html, body { height: 100%; overflow: hidden; }

        .opo-layout {
            display: flex;
            height: calc(100vh - 3.75rem);
        }

        /* ── Painel esquerdo ── */
        .oi-painel {
            width: 21.25rem;
            flex-shrink: 0;
            background: var(--p3-surface, #fff);
            border-right: 1px solid var(--p3-border, #ddd);
            overflow-y: auto;
            padding: 1rem;
        }

        .oi-secao {
            background: var(--p3-bg, #f5f5f5);
            border: 1px solid var(--p3-border, #ddd);
            border-radius: 10px;
            padding: .9rem 1rem;
            margin-bottom: 1rem;
        }

        .oi-secao h3 {
            margin: 0 0 .6rem;
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--p3-text-muted, #666);
        }

        .oi-campo { margin-bottom: .6rem; }

        .oi-campo label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            margin-bottom: .25rem;
            color: var(--p3-text, #222);
        }

        .oi-campo input, .oi-campo select {
            width: 100%;
            padding: .4rem .5rem;
            border: 1px solid var(--p3-border, #ccc);
            border-radius: 6px;
            font-size: .82rem;
            background: var(--p3-surface, #fff);
            color: var(--p3-text, #222);
        }

        .oi-campo-linha { display: flex; gap: .5rem; }
        .oi-campo-linha .oi-campo { flex: 1; }

        /* ── Paleta de unidades (arrastáveis) ── */
        .oi-paleta {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
        }

        .oi-card-unidade {
            display: flex;
            align-items: center;
            gap: .4rem;
            padding: .4rem .6rem;
            border-radius: 20px;
            border: 1.5px solid var(--cor, #333);
            color: var(--cor, #333);
            font-size: .76rem;
            font-weight: 600;
            cursor: grab;
            background: var(--p3-surface, #fff);
            user-select: none;
        }

        .oi-card-unidade:active { cursor: grabbing; }

        .oi-card-unidade .bolinha {
            width: .55rem;
            height: .55rem;
            border-radius: 50%;
            background: var(--cor, #333);
            flex-shrink: 0;
        }

        .oi-ajuda {
            font-size: .74rem;
            color: var(--p3-text-muted, #777);
            margin: .4rem 0 0;
            line-height: 1.4;
        }

        /* ── Lista de unidades posicionadas ── */
        .oi-item-posicionado {
            border: 1px solid var(--p3-border, #ddd);
            border-radius: 8px;
            padding: .55rem .65rem;
            margin-bottom: .5rem;
            background: var(--p3-surface, #fff);
        }

        .oi-item-posicionado .titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: .82rem;
            margin-bottom: .3rem;
        }

        .oi-item-posicionado .endereco {
            font-size: .76rem;
            color: var(--p3-text-muted, #666);
            margin-bottom: .4rem;
        }

        .oi-item-posicionado .linha-mini {
            display: flex;
            gap: .4rem;
            align-items: center;
        }

        .oi-item-posicionado .linha-mini input {
            flex: 1;
            padding: .25rem .35rem;
            font-size: .75rem;
            border: 1px solid var(--p3-border, #ccc);
            border-radius: 5px;
            background: var(--p3-surface, #fff);
            color: var(--p3-text, #222);
        }

        .oi-btn-remover {
            background: none;
            border: none;
            color: var(--p3-danger, #c0392b);
            cursor: pointer;
            font-size: .9rem;
            padding: 0 .2rem;
        }

        .oi-vazio {
            font-size: .78rem;
            color: var(--p3-text-muted, #888);
            text-align: center;
            padding: .8rem 0;
        }

        .oi-check {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .8rem;
        }

        /* ── Área do mapa ── */
        .oi-mapa-area {
            flex: 1;
            position: relative;
        }

        #oi-mapa { width: 100%; height: 100%; }

        .oi-drop-hint {
            position: absolute;
            top: .7rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .72);
            color: #fff;
            padding: .4rem .9rem;
            border-radius: 20px;
            font-size: .78rem;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s;
        }

        .oi-drop-hint.ativo { opacity: 1; }

        /* ── Documento gerado (mesmo modelo do OPO Inteligente) ── */
        #oi-overlay-doc {
            display: none;
            position: fixed;
            inset: 0;
            background: #888;
            z-index: 2000;
            overflow-y: auto;
            padding: 24px;
        }

        #oi-overlay-doc.aberto { display: block; }

        .oi-doc-barra {
            max-width: 210mm;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-end;
            gap: .5rem;
        }

        .oi-doc-barra button {
            padding: .45rem .9rem;
            border-radius: 6px;
            border: none;
            background: #003366;
            color: #fff;
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .folha-a4 {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 18mm 20mm;
            margin: 0 auto;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .4);
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            color: #000;
            line-height: 1.35;
        }

        .opo-cabecalho {
            text-align: center;
            margin-bottom: 14px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .opo-cabecalho .orgao {
            font-size: 10pt;
            font-weight: bold;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .opo-cabecalho .titulo-opo {
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            margin: 4px 0;
        }

        .opo-cabecalho .subtitulo { font-size: 11pt; }

        .opo-protocolo { font-weight: bold; font-size: 10pt; margin-bottom: 10px; }

        .tab-info { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11pt; }
        .tab-info td { border: 1px solid #000; padding: 4px 7px; }
        .tab-info td:first-child { font-weight: bold; width: 35%; background: #f0f0f0; }

        .tab-info .titulo-tab {
            text-align: center;
            font-weight: bold;
            background: #d0d0d0;
            font-size: 11pt;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .opo-secao {
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
            font-size: 11pt;
            margin: 12px 0 5px 0;
        }

        .opo-texto { text-align: justify; margin: 4px 0; font-size: 11pt; }

        .tab-efetivo { width: 100%; border-collapse: collapse; font-size: 10.5pt; margin-top: 6px; }
        .tab-efetivo th { background: #e0e0e0; border: 1px solid #000; padding: 4px 6px; text-align: center; font-size: 10pt; }
        .tab-efetivo td { border: 1px solid #000; padding: 3px 6px; }

        .assinatura { margin-top: 50px; text-align: center; font-size: 11pt; }
        .assinatura .linha { margin-bottom: 4px; }

        @media print {
            body { background: white !important; }
            header, .oi-painel, .oi-doc-barra, .no-print { display: none !important; }
            .opo-layout { display: none !important; }
            #oi-overlay-doc { position: static; padding: 0; background: white; }
            .folha-a4 { box-shadow: none; margin: 0; width: 100%; }
        }
    </style>
</head>

<body>
    <script src="../js/core/session.js"></script>
    <script src="../js/cumprimento-core.js"></script>

    <!-- ═══════ CABEÇALHO ═══════ -->
    <header>
        <div class="header-info-left">
            <img class="brasao" src="../img/brasao.png" alt="brasão do 10º Batalhão">
            <div class="cabecalhotexto">
                <h1>SISTEMA DE GERENCIAMENTO P3</h1>
                <h3 id="cabecalho-unidade"></h3>
            </div>
        </div>
        <div class="header-info-right">
            <button id="btn-tema" class="btn-tema" type="button" title="Alternar modo escuro" aria-label="Alternar modo escuro">
                <svg class="icone-sol" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <svg class="icone-lua" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
            <a href="../page/dashboard-mapa.html" class="btn-imprimir">Voltar</a>
            <button class="btn-imprimir" onclick="gerarDocumentoOPO()">📄 GERAR OPO</button>
            <button class="btn-imprimir" id="btn-salvar-opo" onclick="salvarOpoAtual()">💾 SALVAR OPO</button>
        </div>
    </header>

    <div class="opo-layout">
        <!-- ═══════ PAINEL ESQUERDO ═══════ -->
        <aside class="oi-painel">
            <div class="oi-secao">
                <h3>Dados da Operação</h3>
                <div class="oi-campo">
                    <label for="oi-nome-op">Nome da Operação</label>
                    <input type="text" id="oi-nome-op" placeholder="Ex.: OPERAÇÃO SAFRA SEGURA">
                </div>
                <div class="oi-campo-linha">
                    <div class="oi-campo">
                        <label for="oi-data-op">Data</label>
                        <input type="date" id="oi-data-op">
                    </div>
                    <div class="oi-campo">
                        <label for="oi-turno-op">Turno</label>
                        <select id="oi-turno-op">
                            <option value="Diurno">Diurno</option>
                            <option value="Noturno">Noturno</option>
                            <option value="Integral (24h)">Integral (24h)</option>
                        </select>
                    </div>
                </div>
                <div class="oi-campo-linha">
                    <div class="oi-campo">
                        <label for="oi-ini-padrao">Início padrão</label>
                        <input type="time" id="oi-ini-padrao" value="06:00">
                    </div>
                    <div class="oi-campo">
                        <label for="oi-fim-padrao">Fim padrão</label>
                        <input type="time" id="oi-fim-padrao" value="18:00">
                    </div>
                </div>
                <label class="oi-check">
                    <input type="checkbox" id="oi-check-perimetros" checked onchange="alternarPerimetrosCartao()">
                    Mostrar perímetros do cartão-programa no mapa
                </label>
            </div>

            <div class="oi-secao">
                <h3>Unidades disponíveis</h3>
                <div class="oi-paleta" id="oi-paleta"></div>
                <p class="oi-ajuda">Clique e arraste uma unidade para o ponto do mapa onde ela deve atuar. O endereço (rua/bairro) é identificado automaticamente.</p>
            </div>

            <div class="oi-secao">
                <h3>Unidades posicionadas</h3>
                <div id="oi-lista-posicionadas"><p class="oi-vazio">Nenhuma unidade posicionada ainda.</p></div>
            </div>
        </aside>

        <!-- ═══════ MAPA ═══════ -->
        <main class="oi-mapa-area">
            <div id="oi-mapa"></div>
            <div class="oi-drop-hint" id="oi-drop-hint">Solte para posicionar a guarnição</div>
        </main>
    </div>

    <!-- ═══════ DOCUMENTO GERADO ═══════ -->
    <div id="oi-overlay-doc">
        <div class="oi-doc-barra no-print">
            <button onclick="window.print()">🖨 Imprimir</button>
            <button onclick="fecharDocumentoOPO()">✕ Fechar</button>
        </div>
        <div id="oi-conteudo-doc"></div>
    </div>

    <script>
        'use strict';

        // ── Paleta fixa de unidades — mesma nomenclatura usada em todo o
        // sistema (SEED_RP_VIATURA, cartão-programa, OPO Inteligente): RP
        // 01–09 como guarnições titulares, FT/PELOPES/TÁTICO como reforço
        // especializado. Não vem de rastreamento ao vivo — uma OPO é
        // planejamento de emprego futuro, não a posição atual da viatura.
        const ROSTER_UNIDADES = [
            { id: 'rp01', label: 'RP 01' }, { id: 'rp02', label: 'RP 02' },
            { id: 'rp03', label: 'RP 03' }, { id: 'rp04', label: 'RP 04' },
            { id: 'rp05', label: 'RP 05' }, { id: 'rp06', label: 'RP 06' },
            { id: 'rp07', label: 'RP 07' }, { id: 'rp08', label: 'RP 08' },
            { id: 'rp09', label: 'RP 09' },
            { id: 'ft', label: 'FT (Força Tática)' },
            { id: 'pelopes', label: 'PELOPES' },
            { id: 'tatico-urbano', label: 'TÁTICO URBANO' },
            { id: 'tatico-rural-01', label: 'TÁTICO RURAL 01' },
            { id: 'tatico-rural-02', label: 'TÁTICO RURAL 02' },
        ];

        // Mesmo critério de cor por tipo de guarnição usado em
        // rastreamento-guarnicao.html (corPorGuarnicao) — mantém a
        // identidade visual igual em todo o sistema.
        function corPorGuarnicao(nome) {
            const n = (nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
            if (n.includes('PELOPES') || n.includes('TATICO')) return '#111111';
            if (n.includes('FT')) return '#e65100';
            if (n.includes('RP')) return '#1565c0';
            return '#2e7d32';
        }

        // Mesmo pin em gota com pictograma de viatura usado em
        // rastreamento-guarnicao.html — reaproveitado aqui pra manter a
        // mesma identidade visual dos marcadores no mapa de rastreamento.
        function iconePorGuarnicao(nome) {
            const cor = corPorGuarnicao(nome);
            const svg = `
                <svg width="34" height="42" viewBox="0 0 34 42" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 0C7.611 0 0 7.611 0 17c0 11.75 17 25 17 25s17-13.25 17-25C34 7.611 26.389 0 17 0z"
                          fill="${cor}" stroke="#fff" stroke-width="1.5"/>
                    <circle cx="17" cy="17" r="12" fill="#fff"/>
                    <g fill="#111111">
                        <path d="M11 14l1-1.2h10L23 14v1h-2v1.3h-8V15H11z"/>
                        <rect x="8.5" y="15.3" width="17" height="6.4" rx="2.3"/>
                        <circle cx="12.2" cy="18.4" r="1.35" fill="#fff"/>
                        <circle cx="21.8" cy="18.4" r="1.35" fill="#fff"/>
                        <rect x="12.5" y="10.6" width="9" height="2" rx="1"/>
                        <path d="M13.5 10.4l-1.6-2.1M17 10.2V8M20.5 10.4l1.6-2.1" stroke="#111111" stroke-width="1.1" stroke-linecap="round"/>
                    </g>
                </svg>`;
            return L.divIcon({
                className: '',
                html: `<div style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));">${svg}</div>`,
                iconSize: [34, 42], iconAnchor: [17, 42], popupAnchor: [0, -38]
            });
        }

        function escHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── Mapa ──
        const mapa = L.map('oi-mapa', { zoomControl: true }).setView([-9.4500, -36.6200], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap', maxZoom: 19
        }).addTo(mapa);

        // ── Perímetros do cartão-programa (referência visual) — mesmo
        // desenho de rastreamento-guarnicao.html: 1 círculo por área
        // (lat/lng/raioKm) salva em cronograma[]/alocacoes[], agrupando
        // linhas com a MESMA área. Só carrega os cartões VÁLIDOS.
        let circulosCartaoPrograma = [];
        function desenharPerimetrosCartaoPrograma(cartoes) {
            circulosCartaoPrograma.forEach(c => mapa.removeLayer(c));
            circulosCartaoPrograma = [];
            const grupos = new Map();
            cartoes.forEach(cartao => {
                const linhas = cartao.tipo === 'opo' ? (cartao.alocacoes || []) : (cartao.cronograma || []);
                linhas.forEach(linha => {
                    if (!linha.area) return;
                    if (window.CumprimentoCore && window.CumprimentoCore.ehBlocoAdministrativo(linha.det)) return;
                    const chave = `${linha.area.lat.toFixed(4)}_${linha.area.lng.toFixed(4)}_${linha.area.raioKm}`;
                    if (!grupos.has(chave)) grupos.set(chave, { area: linha.area, itens: [] });
                    grupos.get(chave).itens.push(linha);
                });
            });
            grupos.forEach(grupo => {
                const circulo = L.circle([grupo.area.lat, grupo.area.lng], {
                    radius: grupo.area.raioKm * 1000,
                    color: '#003366', weight: 1.2, opacity: 0.55, fillOpacity: 0.06, dashArray: '4,4',
                }).addTo(mapa);
                const itens = grupo.itens.map(l => `<li>${escHtml(l.ini || '')}–${escHtml(l.fim || '')} — ${escHtml(l.miss || '')}<br>${escHtml(l.det || '')}</li>`).join('');
                circulo.bindPopup(`<div style="max-width:240px;"><small>Cartão-programa — perímetro ${grupo.area.raioKm} km</small><ul style="padding-left:16px;margin:.3rem 0 0;">${itens}</ul></div>`);
                circulosCartaoPrograma.push(circulo);
            });
        }

        let mostrarPerimetros = true;
        async function carregarPerimetrosCartaoPrograma() {
            try {
                const cfg = await P3.loadUnidadeConfig();
                const dbUrl = cfg.firebase.databaseURL;
                const res = await fetch(`${dbUrl}/cartoes_programa.json`);
                const dados = res.ok ? await res.json() : {};
                const todos = Object.entries(dados || {}).map(([id, v]) => Object.assign({ id }, v));
                const validos = todos.filter(c => !window.CumprimentoCore || window.CumprimentoCore.ehCartaoValido(c));
                if (mostrarPerimetros) desenharPerimetrosCartaoPrograma(validos);
            } catch (e) { console.error('[OPO Interativa] Falha ao carregar cartões-programa', e); }
        }
        function alternarPerimetrosCartao() {
            mostrarPerimetros = document.getElementById('oi-check-perimetros').checked;
            if (mostrarPerimetros) carregarPerimetrosCartaoPrograma();
            else { circulosCartaoPrograma.forEach(c => mapa.removeLayer(c)); circulosCartaoPrograma = []; }
        }

        // ── Geocodificação reversa (Nominatim) — só dispara no DROP, nunca
        // durante o arrasto; cache por coordenada arredondada e uma fila
        // com espaçamento mínimo de 1.1s entre chamadas (política de uso
        // do Nominatim: no máx. 1 req/s).
        const cacheGeocodificacao = new Map();
        let filaGeocodificacao = Promise.resolve();
        function geocodificarReverso(lat, lng) {
            const chave = lat.toFixed(5) + ',' + lng.toFixed(5);
            if (cacheGeocodificacao.has(chave)) return Promise.resolve(cacheGeocodificacao.get(chave));
            const tarefa = filaGeocodificacao.then(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                    const dados = res.ok ? await res.json() : null;
                    const addr = (dados && dados.address) || {};
                    const rua = addr.road || addr.pedestrian || addr.footway || '';
                    const bairro = addr.suburb || addr.neighbourhood || addr.village || addr.quarter || '';
                    const cidade = addr.town || addr.city || addr.municipality || '';
                    const texto = [rua, bairro, cidade].filter(Boolean).join(', ') || (dados && dados.display_name) || 'Local não identificado';
                    const resultado = { rua, bairro, cidade, texto };
                    cacheGeocodificacao.set(chave, resultado);
                    return resultado;
                } catch (e) {
                    return { rua: '', bairro: '', cidade: '', texto: 'Não foi possível identificar o endereço' };
                } finally {
                    await new Promise(r => setTimeout(r, 1100));
                }
            });
            filaGeocodificacao = tarefa.catch(() => {});
            return tarefa;
        }

        // ── Unidades posicionadas no mapa ──
        let unidadesPosicionadas = []; // { uid, guarnicao, lat, lng, ini, fim, raioKm, endereco, marker, circulo }
        let contadorUid = 0;

        function renderizarPaleta() {
            const cont = document.getElementById('oi-paleta');
            cont.innerHTML = ROSTER_UNIDADES.map(u => {
                const cor = corPorGuarnicao(u.label);
                return `<div class="oi-card-unidade" draggable="true" data-id="${u.id}" data-label="${escHtml(u.label)}" style="--cor:${cor};">
                    <span class="bolinha"></span>${escHtml(u.label)}
                </div>`;
            }).join('');
            cont.querySelectorAll('.oi-card-unidade').forEach(card => {
                card.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', card.dataset.label);
                    e.dataTransfer.effectAllowed = 'copy';
                });
            });
        }

        function atualizarCirculo(item) {
            if (item.circulo) mapa.removeLayer(item.circulo);
            item.circulo = L.circle([item.lat, item.lng], {
                radius: item.raioKm * 1000,
                color: corPorGuarnicao(item.guarnicao), weight: 2, opacity: .8, fillOpacity: .12,
            }).addTo(mapa);
        }

        function renderizarListaPosicionadas() {
            const cont = document.getElementById('oi-lista-posicionadas');
            if (!unidadesPosicionadas.length) {
                cont.innerHTML = '<p class="oi-vazio">Nenhuma unidade posicionada ainda.</p>';
                return;
            }
            cont.innerHTML = unidadesPosicionadas.map(item => `
                <div class="oi-item-posicionado" data-uid="${item.uid}">
                    <div class="titulo">
                        <span style="color:${corPorGuarnicao(item.guarnicao)};">● ${escHtml(item.guarnicao)}</span>
                        <button class="oi-btn-remover" onclick="removerUnidade(${item.uid})" title="Remover">✕</button>
                    </div>
                    <div class="endereco">${escHtml(item.endereco || 'Identificando endereço...')}</div>
                    <div class="linha-mini">
                        <input type="time" value="${item.ini}" onchange="atualizarCampoUnidade(${item.uid}, 'ini', this.value)" title="Início">
                        <input type="time" value="${item.fim}" onchange="atualizarCampoUnidade(${item.uid}, 'fim', this.value)" title="Fim">
                        <input type="number" min="0.2" max="10" step="0.1" value="${item.raioKm}" onchange="atualizarCampoUnidade(${item.uid}, 'raioKm', this.value)" title="Raio (km)" style="max-width:4.2rem;">
                    </div>
                </div>`).join('');
        }

        function atualizarCampoUnidade(uid, campo, valor) {
            const item = unidadesPosicionadas.find(i => i.uid === uid);
            if (!item) return;
            item[campo] = campo === 'raioKm' ? (parseFloat(valor) || 1) : valor;
            if (campo === 'raioKm') atualizarCirculo(item);
        }

        function removerUnidade(uid) {
            const item = unidadesPosicionadas.find(i => i.uid === uid);
            if (!item) return;
            if (item.marker) mapa.removeLayer(item.marker);
            if (item.circulo) mapa.removeLayer(item.circulo);
            unidadesPosicionadas = unidadesPosicionadas.filter(i => i.uid !== uid);
            renderizarListaPosicionadas();
        }
        window.removerUnidade = removerUnidade;
        window.atualizarCampoUnidade = atualizarCampoUnidade;

        async function adicionarUnidade(guarnicao, lat, lng) {
            const uid = ++contadorUid;
            const iniPadrao = document.getElementById('oi-ini-padrao').value || '06:00';
            const fimPadrao = document.getElementById('oi-fim-padrao').value || '18:00';
            const item = {
                uid, guarnicao, lat, lng, ini: iniPadrao, fim: fimPadrao, raioKm: 1,
                endereco: '', marker: null, circulo: null,
            };
            item.marker = L.marker([lat, lng], { icon: iconePorGuarnicao(guarnicao) }).addTo(mapa)
                .bindPopup(`<strong>${escHtml(guarnicao)}</strong><br><small>Identificando endereço...</small>`);
            atualizarCirculo(item);
            unidadesPosicionadas.push(item);
            renderizarListaPosicionadas();

            const geo = await geocodificarReverso(lat, lng);
            item.endereco = geo.texto;
            item.marker.setPopupContent(`<strong>${escHtml(guarnicao)}</strong><br><small>${escHtml(geo.texto)}</small>`);
            renderizarListaPosicionadas();
        }

        // ── Drag & drop nativo do mapa ──
        const containerMapa = mapa.getContainer();
        const dicaDrop = document.getElementById('oi-drop-hint');
        containerMapa.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            dicaDrop.classList.add('ativo');
        });
        containerMapa.addEventListener('dragleave', () => dicaDrop.classList.remove('ativo'));
        containerMapa.addEventListener('drop', e => {
            e.preventDefault();
            dicaDrop.classList.remove('ativo');
            const guarnicao = e.dataTransfer.getData('text/plain');
            if (!guarnicao) return;
            const ponto = mapa.mouseEventToLatLng(e);
            adicionarUnidade(guarnicao, ponto.lat, ponto.lng);
        });

        // ── Geração do documento (mesmo modelo visual da OPO Inteligente:
        // cabeçalho PMAL/10ºBPM, protocolo, tabela de identificação,
        // efetivo empenhado, orientações, prescrições, assinatura) ──
        function gerarDocumentoOPO() {
            if (!unidadesPosicionadas.length) { alert('Posicione ao menos 1 unidade no mapa antes de gerar a OPO.'); return; }

            const nomeOP = (document.getElementById('oi-nome-op').value || 'OPERAÇÃO SEM NOME').toUpperCase();
            const dataInput = document.getElementById('oi-data-op').value;
            const dataBR = dataInput ? new Date(dataInput + 'T00:00:00').toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
            const turno = document.getElementById('oi-turno-op').value;
            const hoje = new Date().toLocaleDateString('pt-BR');
            const protocolo = `OPO Nº ${Date.now().toString().slice(-6)}/${new Date().getFullYear()} — 10ºBPM/P3`;

            const linhasEfetivo = unidadesPosicionadas.map(item => `
                <tr>
                    <td><strong>${escHtml(item.guarnicao)}</strong></td>
                    <td>${escHtml(item.endereco || '—')}</td>
                    <td>${escHtml(item.ini)} às ${escHtml(item.fim)}</td>
                    <td>${item.raioKm} km</td>
                </tr>`).join('');

            const html = `
    <div class="folha-a4">
        <div class="opo-cabecalho">
            <div class="orgao">ESTADO DE ALAGOAS — POLÍCIA MILITAR DE ALAGOAS</div>
            <div class="orgao">10° BATALHÃO DE POLÍCIA MILITAR</div>
            <div class="orgao">SEÇÃO DE PLANEJAMENTO, INSTRUÇÃO E ESTATÍSTICA — P3</div>
            <div class="titulo-opo">${escHtml(nomeOP)}</div>
            <div class="subtitulo">ORDEM DE POLICIAMENTO OSTENSIVO</div>
        </div>

        <div class="opo-protocolo">${protocolo}</div>

        <p class="opo-texto">O Comandante do 10º BPM, no uso de suas atribuições legais, determina a
        execução da seguinte Ordem de Policiamento Ostensivo, com emprego das guarnições e pontos de
        atuação abaixo definidos:</p>

        <table class="tab-info">
            <tr><td colspan="2" class="titulo-tab">IDENTIFICAÇÃO DA OPERAÇÃO</td></tr>
            <tr><td>Nome da Operação</td><td><strong>${escHtml(nomeOP)}</strong></td></tr>
            <tr><td>Data</td><td>${dataBR}</td></tr>
            <tr><td>Turno</td><td>${escHtml(turno)}</td></tr>
            <tr><td>Guarnições empenhadas</td><td>${unidadesPosicionadas.length}</td></tr>
            <tr><td>Data de emissão</td><td>${hoje}</td></tr>
        </table>

        <div class="opo-secao">EFETIVO E MEIOS — EFETIVO EMPENHADO</div>
        <p class="opo-texto">As guarnições abaixo serão empenhadas nos pontos determinados, identificados por
        georreferenciamento reverso:</p>
        <table class="tab-efetivo">
            <thead><tr><th>Guarnição</th><th>Local (rua / bairro)</th><th>Horário</th><th>Raio de atuação</th></tr></thead>
            <tbody>${linhasEfetivo}</tbody>
        </table>

        <div class="opo-secao">1. ORIENTAÇÕES OPERACIONAIS</div>
        <p class="opo-texto">a) O policiamento se destina ao cumprimento do artigo 144 da Constituição Federal
        c/c com o art. 5º, incisos X e XI, da Lei 14.751/2023.</p>
        <p class="opo-texto">b) As guarnições deverão permanecer nos pontos determinados durante o horário
        estabelecido, realizando policiamento rádio-motorizado e a pé no perímetro indicado.</p>
        <p class="opo-texto">c) Durante as abordagens, as guarnições deverão realizar consultas veiculares
        pelo aplicativo QUIMERA ou através do COPOM do 10º BPM. Consultas de indivíduos serão realizadas
        através do COPOM/CAD/BNMP-MJ.</p>
        <p class="opo-texto">d) Todo o policiamento deverá ser executado com luzes vermelhas intermitentes
        (rotativos) ligados para maior visibilidade e efeito preventivo.</p>

        <div class="opo-secao">2. PRESCRIÇÕES DIVERSAS</div>
        <p class="opo-texto">a) As guarnições escaladas deverão se apresentar ao COPOM no início da operação,
        informando dados dos HTs digitais móveis e da viatura.</p>
        <p class="opo-texto">b) Todas as ocorrências deverão ser imediatamente comunicadas ao COPOM para
        geração dos Boletins de Ocorrência.</p>
        <p class="opo-texto">c) Em caso de flagrante, adotar as medidas pertinentes à apresentação do infrator
        na delegacia plantonista.</p>

        <div class="assinatura">
            <div style="margin-bottom:60px;"></div>
            <div class="linha">____________________________________________________</div>
            <div class="linha"><strong>ANTÔNIO ANDRÉ ANDRADE DE OLIVEIRA BARBOSA — MAJ QOEM PM</strong></div>
            <div class="linha">Comandante do 10º BPM</div>
        </div>
    </div>`;

            document.getElementById('oi-conteudo-doc').innerHTML = html;
            document.getElementById('oi-overlay-doc').classList.add('aberto');
        }
        function fecharDocumentoOPO() {
            document.getElementById('oi-overlay-doc').classList.remove('aberto');
        }
        window.gerarDocumentoOPO = gerarDocumentoOPO;
        window.fecharDocumentoOPO = fecharDocumentoOPO;

        // ── Salvar — mesmo formato {tipo:'opo', alocacoes:[...]} já lido
        // por rastreamento-guarnicao.html (desenharPerimetroCartao), sem
        // precisar alterar nada lá: cada unidade posicionada vira 1 linha
        // de alocacoes com área = círculo desenhado no mapa.
        async function salvarOpoAtual() {
            if (!unidadesPosicionadas.length) { alert('Posicione ao menos 1 unidade no mapa antes de salvar.'); return; }
            const btn = document.getElementById('btn-salvar-opo');
            const textoOriginal = btn.textContent;
            btn.disabled = true; btn.textContent = '⏳ Salvando...';

            try {
                const cfg = await P3.loadUnidadeConfig();
                const dbUrl = cfg.firebase.databaseURL;
                const sessao = window.P3 && window.P3.getSession ? window.P3.getSession() : null;
                const nomeOP = (document.getElementById('oi-nome-op').value || 'OPERAÇÃO SEM NOME').toUpperCase();
                const dataInput = document.getElementById('oi-data-op').value;
                const dataBR = dataInput ? new Date(dataInput + 'T00:00:00').toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
                const turno = document.getElementById('oi-turno-op').value;
                const criadoEm = new Date().toISOString();

                const alocacoes = unidadesPosicionadas.map(item => ({
                    cidade: item.endereco || null,
                    guarnicao: item.guarnicao,
                    nivel: null,
                    ini: item.ini,
                    fim: item.fim,
                    miss: nomeOP,
                    det: `${item.endereco || 'Local sem endereço identificado'} — ${item.guarnicao}`,
                    area: { lat: item.lat, lng: item.lng, raioKm: item.raioKm, origem: 'geocodificacao-reversa' },
                    viaturaResponsavel: item.guarnicao,
                }));

                const payload = {
                    tipo: 'opo',
                    criadoEm,
                    validoAte: window.CumprimentoCore ? window.CumprimentoCore.calcularValidoAte(criadoEm) : null,
                    criadoPor: sessao ? [sessao.graduacao, sessao.nomeGuerra].filter(Boolean).join(' ') : null,
                    data: dataBR,
                    cidade: 'OPO INTERATIVA — MÚLTIPLOS PONTOS',
                    escopo: 'manual',
                    nomeOperacao: nomeOP,
                    turno,
                    alocacoes,
                };

                const res = await fetch(`${dbUrl}/cartoes_programa.json`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error('Falha ao gravar no Firebase');

                btn.textContent = '✅ Salvo!';
                setTimeout(() => { btn.disabled = false; btn.textContent = textoOriginal; }, 3000);
                if (mostrarPerimetros) carregarPerimetrosCartaoPrograma();
            } catch (err) {
                console.error(err);
                alert('Não foi possível salvar a OPO. Tente novamente.');
                btn.disabled = false; btn.textContent = textoOriginal;
            }
        }
        window.salvarOpoAtual = salvarOpoAtual;
        window.alternarPerimetrosCartao = alternarPerimetrosCartao;

        // ── Inicialização ──
        (function iniciar() {
            document.getElementById('oi-data-op').value = new Date().toISOString().slice(0, 10);
            renderizarPaleta();
            carregarPerimetrosCartaoPrograma();
        })();
    </script>
</body>

</html>
