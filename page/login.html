<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema P3</title>
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .btn-tema-login {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
        }
        .btn-tema-login:hover { background: rgba(255, 255, 255, 0.22); }

        body {
            font-family: var(--p3-font);
            background: linear-gradient(135deg, var(--p3-blue-900) 0%, var(--p3-blue-700) 60%, var(--p3-blue-900) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: var(--p3-surface);
            border-radius: var(--p3-radius-lg);
            padding: 2.5rem 2rem;
            width: min(420px, 100%);
            box-shadow: var(--p3-shadow-lg);
        }

        .login-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid #e8ecf5;
        }

        .login-header img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .login-header-txt h2 {
            font-size: .95rem;
            color: var(--p3-blue-900);
            font-weight: 700;
            line-height: 1.3;
        }

        .login-header-txt p {
            font-size: .75rem;
            color: #6b7594;
            margin-top: .2rem;
        }

        /* Abas Login / Cadastro */
        .tabs {
            display: flex;
            border-radius: 8px;
            background: #f0f2f8;
            padding: 4px;
            margin-bottom: 1.75rem;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: .55rem;
            border: none;
            border-radius: 6px;
            background: transparent;
            font-size: .85rem;
            font-weight: bold;
            color: #6b7594;
            cursor: pointer;
            transition: all .2s;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--p3-blue-900);
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        /* Formulário */
        .painel { display: none; }
        .painel.ativo { display: block; }

        .campo { margin-bottom: 1.1rem; }

        .campo label {
            display: block;
            font-size: .78rem;
            font-weight: bold;
            color: #374263;
            margin-bottom: .35rem;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #d5daea;
            border-radius: 7px;
            font-size: .9rem;
            color: #1a1f36;
            transition: border-color .2s;
            background: #fafbff;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: var(--p3-blue-700);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--p3-gradient);
            color: #fff;
            border: none;
            border-radius: var(--p3-radius-sm);
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: .04em;
            margin-top: .5rem;
            transition: opacity .2s;
        }

        .btn-submit:hover { opacity: .9; }
        .btn-submit:disabled { opacity: .55; cursor: not-allowed; }

        /* Mensagem de erro/sucesso */
        .msg {
            font-size: .82rem;
            font-weight: bold;
            padding: .7rem 1rem;
            border-radius: 7px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .msg.erro    { background: #fde8e8; color: #b71c1c; border: 1px solid #f5c6c6; }
        .msg.sucesso { background: #e8f5e9; color: #1b5e20; border: 1px solid #c3e6cb; }

        /* Spinner dentro do botão */
        .spinner-btn {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            margin-top: 1.5rem;
            font-size: .72rem;
            color: rgba(255,255,255,.45);
            text-align: center;
        }

        /* ── Animação de sucesso no login ─────────────────────────── */
        .overlay-sucesso {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--p3-blue-900) 0%, var(--p3-blue-700) 60%, var(--p3-blue-900) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }
        .overlay-sucesso.ativo { opacity: 1; pointer-events: all; }

        .sucesso-conteudo { text-align: center; color: #fff; }

        .check-svg { width: 88px; height: 88px; margin-bottom: 1.1rem; }
        .check-circulo {
            fill: none; stroke: #fff; stroke-width: 2.5;
            stroke-dasharray: 151; stroke-dashoffset: 151;
        }
        .check-marca {
            fill: none; stroke: #fff; stroke-width: 3.5;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 36; stroke-dashoffset: 36;
        }
        .overlay-sucesso.ativo .check-circulo { animation: desenharCirculo .5s ease forwards; }
        .overlay-sucesso.ativo .check-marca   { animation: desenharMarca .35s .45s ease forwards; }
        @keyframes desenharCirculo { to { stroke-dashoffset: 0; } }
        @keyframes desenharMarca   { to { stroke-dashoffset: 0; } }

        .sucesso-texto {
            font-size: 1.15rem; font-weight: 700;
            opacity: 0; transform: translateY(6px);
        }
        .sucesso-sub {
            font-size: .85rem; margin-top: .3rem; color: rgba(255,255,255,.75);
            opacity: 0; transform: translateY(6px);
        }
        .overlay-sucesso.ativo .sucesso-texto { animation: apareceTexto .4s .55s ease forwards; }
        .overlay-sucesso.ativo .sucesso-sub   { animation: apareceTexto .4s .7s ease forwards; }
        @keyframes apareceTexto { to { opacity: 1; transform: translateY(0); } }

        .sucesso-credito {
            font-size: .68rem; margin-top: 1.5rem; color: rgba(255,255,255,.45);
            opacity: 0; letter-spacing: .03em;
        }
        .overlay-sucesso.ativo .sucesso-credito { animation: apareceTexto .4s .9s ease forwards; }
    </style>
</head>
<body>
    <script src="../js/core/session.js"></script>

    <button id="btn-tema" class="btn-tema btn-tema-login" type="button" title="Alternar modo escuro" aria-label="Alternar modo escuro">
        <svg class="icone-sol" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="icone-lua" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </button>

<div class="login-card">
    <div class="login-header">
        <img src="../img/brasao.png" alt="Brasão 10º BPM">
        <div class="login-header-txt">
            <h2>SISTEMA DE GERENCIAMENTO P3</h2>
            <p>10º Batalhão de Polícia Militar</p>
        </div>
    </div>

    <!-- Abas -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-login"    onclick="trocarAba('login')">Entrar</button>
        <button class="tab-btn"        id="tab-cadastro" onclick="trocarAba('cadastro')">Cadastrar</button>
    </div>

    <!-- ══ PAINEL LOGIN ══════════════════════════════════════════ -->
    <div class="painel ativo" id="painel-login">
        <div class="msg" id="msg-login"></div>

        <div class="campo">
            <label>CPF</label>
            <input type="text" id="login-cpf" placeholder="Somente números"

            <input type="password" id="login-senha" placeholder="Sua senha">

        <button class="btn-submit" id="btn-entrar" onclick="fazerLogin()">ENTRAR</button>

    <div class="painel" id="painel-cadastro">
        <div class="msg" id="msg-cadastro"></div>

        <div class="campo">
            <label>Graduação</label>
            <select id="cad-graduacao">
                <option value="">Selecione</option>
                <option>Soldado</option>
                <option>Cabo</option>
                <option>3º Sargento</option>
                <option>2º Sargento</option>
                <option>1º Sargento</option>
                <option>Subtenente</option>
                <option>Aspirante</option>
                <option>2º Tenente</option>
                <option>1º Tenente</option>
                <option>Capitão</option>
                <option>Major</option>
                <option>Tenente Coronel</option>
                <option>Coronel</option>
            </select>
        </div>
        <div class="campo">
            <label>Nome Completo</label>
            <input type="text" id="cad-nome" placeholder="Nome completo">
        </div>
        <div class="campo">
            <label>Nome de Guerra</label>
            <input type="text" id="cad-nomeguerra" placeholder="Como é chamado">
        </div>
        <div class="campo">
            <label>CPF</label>
            <input type="text" id="cad-cpf" placeholder="Somente números"
                maxlength="11" inputmode="numeric">
        </div>
        <div class="campo">
            <label>Senha</label>
            <input type="password" id="cad-senha" placeholder="Crie uma senha">
        </div>
        <div class="campo">
            <label>Unidade</label>
            <select id="cad-unidade">
                <option value="10bpm">10º BPM</option>

</div>

<footer>P3 / 10º BPM — Sistema de Gerenciamento Interno</footer>

    <div class="sucesso-conteudo">
        <svg class="check-svg" viewBox="0 0 52 52">
            <circle class="check-circulo" cx="26" cy="26" r="24"/>
            <path class="check-marca" d="M14 27l7 7 16-16"/>
        </svg>
        <p class="sucesso-texto">Login realizado com sucesso!</p>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURAÇÃO FIREBASE
// ═══════════════════════════════════════════════════════════════
const firebaseConfig = {
    apiKey           : "AIzaSyBRZn_EOfV6ozsx6NNzOlq1sjIV_xVm7xE",
    authDomain       : "sistema-p3-v2.firebaseapp.com",
    projectId        : "sistema-p3-v2",
    storageBucket    : "sistema-p3-v2.firebasestorage.app",
    messagingSenderId: "1019080251258",
    appId            : "1:1019080251258:web:93f9e299cf19b16189e8c3",
    databaseURL      : "https://sistema-p3-v2-default-rtdb.firebaseio.com"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ═══════════════════════════════════════════════════════════════
// UTILITÁRIOS
// ═══════════════════════════════════════════════════════════════
function trocarAba(aba) {
    document.getElementById('painel-login').classList.toggle('ativo', aba === 'login');
    document.getElementById('painel-cadastro').classList.toggle('ativo', aba === 'cadastro');
    document.getElementById('tab-login').classList.toggle('active', aba === 'login');
    document.getElementById('tab-cadastro').classList.toggle('active', aba === 'cadastro');
    limparMensagens();
}

function limparMensagens() {
    ['msg-login', 'msg-cadastro'].forEach(id => {
        const el = document.getElementById(id);
        el.style.display = 'none';
        el.className = 'msg';
        el.textContent = '';
    });
}

function mostrarMensagem(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className   = `msg ${tipo}`;
    el.style.display = 'block';
}

function limparCPF(cpf) {
    return (cpf || '').toString().replace(/\D/g, '').trim();
}

function setBtnLoading(id, loading, textoOriginal) {
    const btn = document.getElementById(id);
    if (loading) {
        btn.innerHTML = `<span class="spinner-btn"></span> Aguarde...`;
        btn.disabled  = true;
    } else {
        btn.textContent = textoOriginal;
        btn.disabled    = false;
    }
}

function mostrarAnimacaoSucesso(nomeExibicao) {
    document.getElementById('sucesso-sub').textContent = `Bem-vindo(a), ${nomeExibicao}`;
    document.getElementById('overlay-sucesso').classList.add('ativo');
}

// ═══════════════════════════════════════════════════════════════
// LOGIN CRUZADO NO ÍRIS PMAL (sistema à parte, mesma unidade, banco
// MySQL/Hostinger) — best-effort e SILENCIOSO: tenta autenticar lá com
// o MESMO CPF+senha que acabou de validar aqui no P3. Se bater, guarda
// o token JWT do Íris (localStorage) pra usar direto na página de
// Rastreamento (dados do botão de pânico). Se não bater (senha
// diferente ou usuário não existe no Íris), NÃO bloqueia nem avisa o
// login do P3 — só não fica com o token; a página de Rastreamento
// oferece autenticar manualmente nesse caso.
const IRIS_API_URL = 'https://irispmal.io/api/iris_api.php';
async function tentarLoginIris(cpf, senha) {
    try {
        const res = await fetch(IRIS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ acao: 'login_mysql', cpf, senha }),
        });
        const data = await res.json().catch(() => null);
        if (data && data.ok && data.token) {
            localStorage.setItem('irisToken', data.token);
            localStorage.setItem('irisUnidadeChave', data.unidade || '');
        } else {
            localStorage.removeItem('irisToken');
            localStorage.removeItem('irisUnidadeChave');
        }
    } catch (e) {
        console.error('Login cruzado no Íris (best-effort) falhou:', e);
    }
}

// Se o usuário chegou aqui deslogado por inatividade (js/core/session.js
// redireciona pra login.html?motivo=inatividade), mostra o motivo em vez
// de deixar o formulário mudo sobre por que ele "caiu" do sistema.
(function avisarSeSessaoExpirou() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('motivo') === 'inatividade') {
        mostrarMensagem('msg-login', 'Sua sessão expirou por inatividade (2h). Faça login novamente.', 'erro');
    }
})();

// ═══════════════════════════════════════════════════════════════
// LOGIN — consulta direto no nó /usuarios/{cpf} do Firebase
// ═══════════════════════════════════════════════════════════════
async function fazerLogin() {
    limparMensagens();
    const cpf   = limparCPF(document.getElementById('login-cpf').value);
    const senha = document.getElementById('login-senha').value.trim();

    if (!cpf || !senha) {
        mostrarMensagem('msg-login', 'Preencha CPF e senha.', 'erro');
        return;
    }

    setBtnLoading('btn-entrar', true, 'ENTRAR');

    try {
        const snap = await db.ref(`usuarios/${cpf}`).once('value');
        const usuario = snap.val();

        if (!usuario) {
            mostrarMensagem('msg-login', 'CPF não encontrado no sistema.', 'erro');
            return;
        }

        if (usuario.senha !== senha) {
            mostrarMensagem('msg-login', 'Senha incorreta.', 'erro');
            return;
        }

        if (usuario.ativo === false) {
            mostrarMensagem('msg-login', 'Usuário inativo. Contate o administrador.', 'erro');
            return;
        }

        // ── Salva sessão no localStorage ──────────────────────
        localStorage.setItem('userCpf',       usuario.cpf);
        localStorage.setItem('userGraduacao', usuario.graduacao);
        localStorage.setItem('userNomeGuerra',usuario.nomeGuerra);
        localStorage.setItem('userNome',      usuario.nome);
        localStorage.setItem('userNivel',     usuario.nivel || 'operador');
        localStorage.setItem('userUnidade',   usuario.unidade || '10bpm');
        localStorage.setItem('userSenha',     senha); // usado para confirmação de exclusão

        // Best-effort, sem await de propósito — não atrasa o login do P3.
        // Roda em paralelo à animação de sucesso (~3.4s), tempo de sobra
        // pra terminar antes do redirecionamento.
        tentarLoginIris(cpf, senha);

        // Animação de sucesso, depois redireciona para a home
        mostrarAnimacaoSucesso(`${usuario.graduacao} ${usuario.nomeGuerra}`);
        setTimeout(() => { window.location.href = '../index.html'; }, 3400);
        return;

    } catch (err) {
        console.error('Erro no login:', err);
        mostrarMensagem('msg-login', 'Erro de conexão. Tente novamente.', 'erro');
    } finally {
        setBtnLoading('btn-entrar', false, 'ENTRAR');
    }
}

// ═══════════════════════════════════════════════════════════════
// CADASTRO — grava no nó /usuarios/{cpf} do Firebase
// ═══════════════════════════════════════════════════════════════
async function fazerCadastro() {
    limparMensagens();

    const graduacao  = document.getElementById('cad-graduacao').value.trim();
    const nome       = document.getElementById('cad-nome').value.trim();
    const nomeGuerra = document.getElementById('cad-nomeguerra').value.trim() || nome.split(' ')[0];
    const cpf        = limparCPF(document.getElementById('cad-cpf').value);
    const senha      = document.getElementById('cad-senha').value.trim();
    const unidade    = document.getElementById('cad-unidade').value;
    // Auto-cadastro normal sempre entra como Operador (ativo na hora).
    // Quem marca "Operador de Campo" entra como esse nível, mas PENDENTE
    // (ativo:false) — login já bloqueia usuário inativo (ver checkAtivo
    // mais abaixo), admin aprova mudando ativo pra true em
    // admin-usuarios.html. Evita alguém ganhar acesso à busca facial de
    // campo só se auto-declarando, sem nenhuma revisão.
    const querOperadorCampo = document.getElementById('cad-operador-campo').checked;
    const nivel      = querOperadorCampo ? 'operador_campo' : 'operador';

    // Validações básicas
    if (!graduacao || !nome || !cpf || !senha) {
        mostrarMensagem('msg-cadastro', 'Preencha todos os campos obrigatórios.', 'erro');
        return;
    }

    if (cpf.length !== 11) {
        mostrarMensagem('msg-cadastro', 'CPF deve ter 11 dígitos.', 'erro');
        return;
    }

    if (senha.length < 4) {
        mostrarMensagem('msg-cadastro', 'A senha deve ter pelo menos 4 caracteres.', 'erro');
        return;
    }

    setBtnLoading('btn-cadastrar', true, 'CADASTRAR');

    try {
        // Verifica se CPF já existe
        const snap = await db.ref(`usuarios/${cpf}`).once('value');
        if (snap.val()) {
            mostrarMensagem('msg-cadastro', 'CPF já cadastrado no sistema.', 'erro');
            return;
        }

        // Grava o novo usuário
        const novoUsuario = {
            graduacao,
            nome,
            nomeGuerra,
            cpf,
            senha,
            nivel,
            unidade,
            ativo      : !querOperadorCampo, // Operador de Campo entra inativo, pendente de aprovação do admin
            cadastrado_em: new Date().toISOString()
        };

        await db.ref(`usuarios/${cpf}`).set(novoUsuario);

        mostrarMensagem('msg-cadastro', querOperadorCampo
            ? 'Cadastro realizado! Fica pendente de aprovação do administrador antes de poder entrar.'
            : 'Cadastro realizado! Você já pode fazer login.', 'sucesso');

        // Limpa o formulário e volta para aba de login após 2s
        document.getElementById('cad-graduacao').value  = '';
        document.getElementById('cad-nome').value       = '';
        document.getElementById('cad-nomeguerra').value = '';
        document.getElementById('cad-cpf').value        = '';
        document.getElementById('cad-senha').value      = '';
        document.getElementById('cad-operador-campo').checked = false;

        setTimeout(() => trocarAba('login'), 2000);

    } catch (err) {
        console.error('Erro no cadastro:', err);
        mostrarMensagem('msg-cadastro', 'Erro ao salvar. Tente novamente.', 'erro');
    } finally {
        setBtnLoading('btn-cadastrar', false, 'CADASTRAR');
    }
}

// ═══════════════════════════════════════════════════════════════
// Popula o <select> de unidades no cadastro (10º BPM já vem fixo)
// ═══════════════════════════════════════════════════════════════
async function carregarUnidadesNoCadastro() {
    const select = document.getElementById('cad-unidade');
    try {
        const snap = await db.ref('unidades').once('value');
        const dados = snap.val();
        if (!dados) return;
        Object.keys(dados).forEach(id => {
            if (id === '10bpm') return; // já existe como opção padrão
            if (dados[id].ativo === false) return;
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = dados[id].nome || id;
            select.appendChild(opt);
        });
    } catch (err) {
        console.error('Erro ao carregar unidades:', err);
    }
}

// ═══════════════════════════════════════════════════════════════
// ENTER confirma nos campos
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
    // Se já está logado, redireciona direto
    if (localStorage.getItem('userGraduacao') && localStorage.getItem('userNomeGuerra')) {
        window.location.href = '../index.html';
        return;
    }

    carregarUnidadesNoCadastro();

    document.getElementById('login-senha').addEventListener('keydown', e => {
        if (e.key === 'Enter') fazerLogin();
    });
    document.getElementById('login-cpf').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('login-senha').focus();
    });
});
</script>
