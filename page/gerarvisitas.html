<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento P3 - Visitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/stylesvisitas.css">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">

<style>
/* --- ESTILO NA TELA (Sempre visível) --- */
.detalhe-criminal {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    white-space: normal !important;
    word-wrap: break-word !important;
    line-height: 1.5;
    padding: 15px;
    background-color: #f8f9fa;
    border-left: 4px solid #ffc107;
    margin-top: 10px;
    display: block !important;
}

/* --- AJUSTES PARA IMPRESSÃO --- */
@media print {
    html, body {
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .pagecomplete, main, #lista-visitas {
        height: auto !important;
        overflow: visible !important;
        display: block !important;
        position: static !important;
    }

    header, .navegacao, .filtros, #btn-logout, .mensagem-status, .no-print, button {
        display: none !important;
    }

    .card-visita {
        width: 100% !important;
        max-width: 100% !important;
        border: 1px solid #000 !important;
        margin-bottom: 20px !important;
        display: block !important;
        position: relative !important;
        background-color: #fff !important;
        box-shadow: none !important;
        page-break-inside: auto !important; /* Permite que o card mude de página se o texto for longo */
    }

    .detalhe-criminal {
        page-break-inside: auto !important; /* Permite que o texto do histórico quebre entre páginas */
        border: 1px solid #ccc !important;
    }

    p, h3, .cop-label {
        page-break-after: avoid; /* Evita títulos sozinhos no fim da página */
    }

    @page {
        size: auto;
        margin: 1.5cm;
    }
}
</style>
</head>

<body>
    <script src="../js/core/session.js"></script>
    <script src="../js/core/header-nav.js"></script>

    <section class="pagecomplete">
        <main>
            <div class="saudacao">
                <h2>Análise de Visitas Orientativas</h2>
                <p>Análise criminal focada em potencial de escalada da violência.</p>
            </div>

            <div class="adicionar-cadastro-container">
                <a id="btn-visitasretornar" href="../page/exibirvisitas.html">
                    <img width="20" height="20" src="https://img.icons8.com/dotty/80/fine-print.png" alt="fine-print" />
                    Visitas Realizadas
                </a>
            </div>

            <div class="ConteudoCadastro">
                <div class="filtro-periodo">
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label style="font-size:0.8em; font-weight:bold;">DATA INICIAL</label>
                        <input type="date" id="data-inicio"
                            style="padding:8px; border-radius:5px; border:1px solid #ccc;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label style="font-size:0.8em; font-weight:bold;">DATA FINAL</label>
                        <input type="date" id="data-fim" style="padding:8px; border-radius:5px; border:1px solid #ccc;">
                    </div>
                    <button class="btn-analisar" onclick="carregarVisitas()">ANALISAR OCORRÊNCIAS</button>
                    <button class="btn-imprimir" onclick="window.print()"
                        style="padding:10px; border-radius:5px; border:1px solid #333; cursor:pointer;">🖨️</button>
                </div>

                <div id="mensagem-status" style="text-align: center; display:none; font-weight: bold; color: #666;">
                    🔄 Processando inteligência criminal no período selecionado...
                </div>

                <div id="lista-visitas" class="container-visitas"></div>
            </div>
        </main>
    </section>

    <footer>
        <div>
            <h4>Seção de Planejamento, Instrução e Estatística - P3/10ºBPM</h4>
        </div>
    <div style="position:fixed;bottom:6px;right:10px;font-size:.65rem;opacity:.5;color:inherit;z-index:1;pointer-events:none;">Criado por 1º Tenente Calheiros</div>
    </footer>

<script src="../js/logica_visitas.js"></script>

<script>
    // 2. Declare as constantes APENAS UMA VEZ aqui
    let DATABASE_URL = null; // definido em runtime a partir da unidade do usuário logado (ver js/core/session.js)
    const NODE_GERAL = "geral";
    const NODE_VISITAS = "visita_comunitaria";

    // Relógio e "Bem-vindo(a)" já são centralizados por js/core/header-nav.js
    // — aqui só falta a guarda de autenticação.

    // --- FUNÇÃO QUE CHAMA A LÓGICA DO ARQUIVO EXTERNO ---
    async function carregarVisitas() {
        const inicio = document.getElementById('data-inicio').value;
        const fim = document.getElementById('data-fim').value;
        const statusMsg = document.getElementById('mensagem-status');
        const container = document.getElementById('lista-visitas');

        if (!inicio || !fim) {
            alert("Por favor, selecione o período inicial e final.");
            return;
        }

        statusMsg.style.display = 'block';
        statusMsg.innerText = "🔄 Analisando inteligência criminal...";
        container.innerHTML = "";

        try {
            // Chama a função que está dentro do logica_visitas.js
            const dados = await buscarOcorrenciasParaVisita(inicio, fim);
            
            statusMsg.style.display = 'none';

            if (!dados || dados.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; background:#fff3cd; border-radius:8px;">⚠️ Nenhuma ocorrência relevante encontrada.</div>`;
                return;
            }

            dados.forEach(oc => {
                const card = document.createElement('div');
                card.className = 'card-visita';
                card.innerHTML = `
                    <div class="info-lado-esquerdo">
                        <span class="badge-alerta">⚠️ RISCO DE ESCALADA</span>
                        <div class="cop-label">COP Nº ${oc.cop}</div>
                        <p><strong>👤 SOLICITANTE:</strong> ${oc.solicitante}</p>
                        <p><strong>📂 NATUREZA:</strong> ${oc.natureza}</p>
                        <p><strong>📅 DATA:</strong> ${oc.data}</p>
                        <p><strong>📍 LOCAL:</strong> ${oc.logradouro}</p>
                        <p><strong>📋 DESFECHO:</strong> ${oc.solucao}</p>
                        <div class="detalhe-criminal">
                            <strong>HISTÓRICO ANALISADO:</strong><br>
                            ${oc.resumo}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error(err);
            statusMsg.innerText = "❌ Erro ao carregar dados.";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!P3.requireAuth()) return;
    });
</script>
</body>

</html>
