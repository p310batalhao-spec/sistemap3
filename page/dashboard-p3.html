<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard P3 — 10º BPM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        /* ── Reset / Base ─────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: var(--p3-font); background: var(--p3-bg); }

        main {
            flex: 1;
            padding: 1.1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        /* ── Cabeçalho do dash ────────────────────────────── */
        .dash-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: .75rem;
            background: var(--p3-gradient);
            border-radius: var(--p3-radius-md);
            padding: 1rem 1.5rem;
            color: #fff;
            box-shadow: var(--p3-shadow-md);
        }
        .dash-header h2 { font-size: 1.05rem; font-weight: bold; }
        .dash-header small { font-size: .75rem; opacity: .7; display: block; margin-top: .15rem; }
        .dash-header .relogio-dash { font-size: .82rem; opacity: .8; text-align: right; }

        /* ── Filtro período ───────────────────────────────── */
        .periodo-bar {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
            background: var(--p3-surface);
            border: 1.5px solid var(--p3-border);
            border-radius: var(--p3-radius-sm);
            padding: .65rem 1rem;
        }
        .periodo-bar label { font-size: .82rem; font-weight: bold; color: #374263; }
        .periodo-bar input[type=date] {
            padding: 6px 10px;
            border: 1.5px solid #d0d5e8;
            border-radius: 6px;
            font-size: .83rem;
        }
        .periodo-bar button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: .82rem;
            font-weight: bold;
        }
        .btn-limpar { background: #e8ecf5; color: #374263; }
        #badge-periodo {
            font-size: .75rem;
            background: #1a237e;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            display: none;
        }

        /* ── KPIs ─────────────────────────────────────────── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: .85rem;
        }
        .kpi-card {
            background: var(--p3-surface);
            border-radius: var(--p3-radius-md);
            padding: 1rem 1.1rem;
            border-top: 4px solid var(--p3-blue-300);
            box-shadow: var(--p3-shadow-sm);
            display: flex;
            flex-direction: column;
            gap: .25rem;
        }
        .kpi-card.cvli  { border-top-color: #6a1b9a; }
        .kpi-card.cvp   { border-top-color: #e65100; }
        .kpi-card.mvi   { border-top-color: #b71c1c; }
        .kpi-card.vd    { border-top-color: #ad1457; }
        .kpi-card.tco   { border-top-color: #1565c0; }
        .kpi-card.arma  { border-top-color: #2e7d32; }
        .kpi-card.drug  { border-top-color: #f57f17; }
        .kpi-card.sos   { border-top-color: #00695c; }
        .kpi-card.mand  { border-top-color: #5c6bc0; }
        .kpi-card.guarn { border-top-color: #00838f; }

        .kpi-label { font-size: .72rem; font-weight: bold; color: #6b7594; text-transform: uppercase; letter-spacing: .05em; }
        .kpi-valor { font-size: 2rem; font-weight: bold; color: #1a1f36; line-height: 1.1; }
        .kpi-sub   { font-size: .72rem; color: #9ea3b5; }

        /* ── Grid de gráficos ─────────────────────────────── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .chart-card {
            background: var(--p3-surface);
            border-radius: var(--p3-radius-md);
            padding: 1.1rem 1.2rem;
            box-shadow: var(--p3-shadow-sm);
        }
        .chart-card.full { grid-column: 1 / -1; }
        .chart-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: .85rem;
            gap: .5rem;
            flex-wrap: wrap;
        }
        .chart-title  { font-size: .85rem; font-weight: bold; color: #1a1f36; }
        .chart-sub    { font-size: .72rem; color: #9ea3b5; margin-top: .1rem; }
        .chart-filter select, .chart-filter input {
            padding: 5px 9px;
            border: 1.5px solid #d0d5e8;
            border-radius: 6px;
            font-size: .8rem;
            background: #fafbff;
        }
        .chart-wrap { position: relative; height: 240px; }
        .chart-wrap.tall { height: 300px; }

        /* ── Tabela de cruzamento ─────────────────────────── */
        .scroll-tabela { overflow-x: auto; }
        .cruzamento-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .78rem;
        }
        .cruzamento-table th {
            background: #f0f2f8;
            color: #374263;
            font-weight: bold;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 2px solid #d0d5e8;
        }
        .cruzamento-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #edf0f8;
            vertical-align: middle;
        }
        .cruzamento-table tr:hover td { background: #f8f9ff; }

        .badge-tip {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: .7rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .tip-cvli { background: #ede7f6; color: #4a148c; }
        .tip-cvp  { background: #fff3e0; color: #e65100; }
        .tip-mvi  { background: #ffebee; color: #b71c1c; }
        .tip-out  { background: #f0f2f8; color: #374263; }
        .obito-s  { background: #c62828; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: .7rem; font-weight: bold; }
        .obito-n  { background: #e0e0e0; color: #555; padding: 2px 8px; border-radius: 4px; font-size: .7rem; }

        /* ── Loader ───────────────────────────────────────── */
        .loader-dash {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            padding: 3rem;
            font-size: .9rem;
            color: #6b7594;
        }

        /* ── Heatmap horário ──────────────────────────────── */
        .hora-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            margin-top: .5rem;
        }
        .hora-cel {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .65rem;
            font-weight: bold;
            cursor: default;
        }

        /* ── Seção título ─────────────────────────────────── */
        .secao-titulo {
            font-size: .82rem;
            font-weight: bold;
            color: #374263;
            text-transform: uppercase;
            letter-spacing: .06em;
            padding: .4rem 0 .1rem;
            border-bottom: 2px solid #e8ecf5;
        }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }
    
        /* ── Cross-filter chips ────────────────────────────── */
        .cross-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            border: 1.5px solid var(--chip-cor, #1565c0);
            border-radius: 20px;
            padding: 3px 10px 3px 8px;
            font-size: .72rem;
            font-weight: 500;
            color: var(--chip-cor, #1565c0);
            white-space: nowrap;
            animation: chipIn .15s ease;
        }
        .cross-chip i { font-size: .65rem; opacity: .8; }
        .cross-chip strong { font-weight: 700; }
        .chip-x {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--chip-cor, #1565c0);
            font-size: .7rem;
            padding: 0 0 0 3px;
            opacity: .7;
            line-height: 1;
        }
        .chip-x:hover { opacity: 1; }
        .cross-clear-all {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0f2f8;
            border: 1.5px solid #c5cae9;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: .72rem;
            font-weight: 600;
            color: #374263;
            cursor: pointer;
            white-space: nowrap;
        }
        .cross-clear-all:hover { background: #e0e3f0; }
        @keyframes chipIn {
            from { opacity:0; transform: scale(.85); }
            to   { opacity:1; transform: scale(1); }
        }

        /* Cursor pointer em todos os canvas (indicativo de clicabilidade) */
        canvas { cursor: pointer; }
        .hora-cel { cursor: pointer !important; }
        </style>
</head>
<body>
    <script src="../js/core/session.js"></script>
    <script src="../js/core/header-nav.js"></script>

    <section class="pagecomplete">
        <main id="dash-main">
            <div class="loader-dash" id="loader">
                <i class="fas fa-spinner fa-spin" style="font-size:1.4rem;color:#1a237e;"></i>
                Carregando dados do Firebase…
            </div>
        </main>
    </section>

    <footer>
        <div><h4>Seção de Planejamento, Instrução e Estatística - P3/10ºBPM</h4></div>
    <div style="position:fixed;bottom:6px;right:10px;font-size:.65rem;opacity:.5;color:inherit;z-index:1;pointer-events:none;">Criado por 1º Tenente Calheiros</div>
    </footer>

    <script src="../js/dashboard-p3.js"></script>
</body>
</html>
