<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 Inteligência — Visão Operacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="../css/p2.css">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
</head>

<body class="p2-body">
    <script src="../js/core/session.js"></script>
    <script src="../js/p2/p2-core.js"></script>
    <script>
        (function () {
            const alvo = P2.iniciar({ active: 'visao-operacional', titulo: 'Visão Operacional', sub: 'Panorama da inteligência — 10º BPM' });
            if (!alvo) return;
            const esc = P2.esc;

            // ── Monta a estrutura estática ──────────────────────────────
            alvo.innerHTML = `
                <div class="p2-page-head">
                    <h1>Bem-vindo à Central de Inteligência P2</h1>
                    <p>Todas as ferramentas de inteligência do 10º BPM num só lugar — missões do disque-denúncia,
                       fichas de alvo, vínculos, RELINT e as ferramentas nativas do P3. Os dados são do mesmo banco
                       de inteligência (online).</p>
                </div>

                <div class="p2-kpis" id="p2-kpis">
                    ${kpiSkel('fa-solid fa-id-card', 'Alvos cadastrados')}
                    ${kpiSkel('fa-solid fa-phone-volume', 'Denúncias')}
                    ${kpiSkel('fa-solid fa-bullseye', 'Missões')}
                    ${kpiSkel('fa-solid fa-people-group', 'Facções')}
                </div>

                <div class="p2-cols">
                    <div class="p2-card">
                        <div class="p2-card-h"><h2>Últimas denúncias</h2>
                            <a class="p2-card-sub" href="p2-missoes.html" style="text-decoration:none;color:var(--p2-accent)">ver missões →</a></div>
                        <div id="p2-recentes" class="p2-list"><div class="p2-empty"><div class="ic">⏳</div><p>Carregando…</p></div></div>
                    </div>
                    <div class="p2-card">
                        <div class="p2-card-h"><h2>Acesso rápido</h2></div>
                        <div class="p2-launch" id="p2-launch"></div>
                    </div>
                </div>
            `;

            // ── Acesso rápido (destaques) ───────────────────────────────
            const destaques = ['missoes', 'ficha-alvo', 'consulta-global', 'analise-vinculos', 'mapa-inteligencia', 'consulta-integrada'];
            document.getElementById('p2-launch').innerHTML = destaques.map(id => {
                const m = P2.moduloPorId(id); if (!m) return '';
                return `<a class="p2-launch-item" href="${esc(m.url)}"><span class="p2-launch-ic">${P2.icone(m.ic)}</span>
                    <span class="p2-launch-tx"><b>${esc(m.nome)}</b><small>${esc(m.sub || '')}</small></span></a>`;
            }).join('');

            function kpiSkel(ic, lab) {
                return `<div class="p2-kpi"><div class="p2-kpi-ic">${P2.icone(ic)}</div>
                    <div class="p2-kpi-val carregando" data-lab="${esc(lab)}">···</div>
                    <div class="p2-kpi-lab">${esc(lab)}</div></div>`;
            }
            function setKpi(lab, val) {
                const el = document.querySelector(`.p2-kpi-val[data-lab="${CSS.escape(lab)}"]`);
                if (el) { el.textContent = val == null ? '—' : val.toLocaleString('pt-BR'); el.classList.remove('carregando'); }
            }

            // ── Dados reais (Supabase do Echelon) ───────────────────────
            (async () => {
                try {
                    const [alvos, den, mis, fac] = await Promise.all([
                        P2.sb.count('tb_pessoas'), P2.sb.count('tb_denuncias'),
                        P2.sb.count('tb_missoes'), P2.sb.count('tb_faccoes'),
                    ]);
                    setKpi('Alvos cadastrados', alvos);
                    setKpi('Denúncias', den);
                    setKpi('Missões', mis);
                    setKpi('Facções', fac);
                } catch (e) {
                    ['Alvos cadastrados', 'Denúncias', 'Missões', 'Facções'].forEach(l => setKpi(l, null));
                }

                const box = document.getElementById('p2-recentes');
                try {
                    const linhas = await P2.sb.get('tb_denuncias',
                        'select=id,numero,tipo,resumo_breve,data_denuncia,status_operacional&order=data_denuncia.desc.nullslast&limit=8');
                    if (!linhas.length) { box.innerHTML = vazio('📭', 'Sem denúncias', 'Nenhuma denúncia cadastrada ainda.'); return; }
                    box.innerHTML = linhas.map(d => {
                        const st = statusBadge(d.status_operacional);
                        const data = d.data_denuncia ? d.data_denuncia.split('-').reverse().join('/') : '';
                        const tit = d.numero ? ('Denúncia nº ' + d.numero) : (d.tipo || 'Denúncia');
                        const sub = (d.tipo && d.numero ? d.tipo + ' · ' : '') + (d.resumo_breve || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 70);
                        return `<a class="p2-li" href="p2-missoes.html">
                            <span class="p2-li-ic"><i class="fa-solid fa-phone-volume"></i></span>
                            <span class="p2-li-tx"><b>${esc(tit)}</b><small>${esc(sub)}</small></span>
                            <span class="p2-li-meta">${st} ${esc(data)}</span></a>`;
                    }).join('');
                } catch (e) {
                    box.innerHTML = vazio('⚠️', 'Não foi possível carregar', 'Verifique a conexão com o banco de inteligência.');
                }
            })();

            function vazio(ic, t, p) { return `<div class="p2-empty"><div class="ic">${ic}</div><h3>${esc(t)}</h3><p>${esc(p)}</p></div>`; }
            function statusBadge(s) {
                if (!s) return '';
                const v = String(s).toLowerCase();
                let cls = 'cinza';
                if (/aprov|conclu|proced|finaliz/.test(v)) cls = 'verde';
                else if (/aberto|pend|revis|distrib|anális|analis/.test(v)) cls = 'amb';
                else if (/improc|devolv|arquiv|cancel/.test(v)) cls = 'verm';
                return `<span class="p2-badge ${cls}">${esc(s)}</span>`;
            }
        })();
    </script>
</body>

</html>
