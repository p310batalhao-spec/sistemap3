<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento P3 - Calendário de Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styleseventos.css">
    <link rel="stylesheet" href="../css/stylescalendario.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet'/>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
</head>

<body>
    <script src="../js/core/session.js"></script>
    <script src="../js/core/header-nav.js"></script>

    <section class="pagecomplete">
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
    </section>

    <!-- ── Modal de Detalhes do Evento ── -->
    <div id="modal-evento">
        <div class="modal-overlay" onclick="fecharModal()"></div>
        <div class="modal-box">
            <h2 id="modal-titulo">Detalhes do Evento</h2>

            <div class="modal-linha">
                <span class="modal-label">📅 Data:</span>
                <span class="modal-valor" id="modal-data"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">⏰ Horário:</span>
                <span class="modal-valor" id="modal-horario"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">📍 Local:</span>
                <span class="modal-valor" id="modal-local"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">🏙️ Cidade:</span>
                <span class="modal-valor" id="modal-cidade"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">👥 Público Est.:</span>
                <span class="modal-valor" id="modal-publico"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">🏢 Organização:</span>
                <span class="modal-valor" id="modal-organizacao"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">👤 Responsável:</span>
                <span class="modal-valor" id="modal-responsavel"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">📞 Telefone:</span>
                <span class="modal-valor" id="modal-telefone"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">🚔 Viaturas:</span>
                <span class="modal-valor" id="modal-viaturas"></span>
            </div>
            <div class="modal-linha">
                <span class="modal-label">🛡️ Guarnições:</span>
                <!--
                    CORREÇÃO (Problema 3): badges renderizados dinamicamente
                    usando as mesmas classes .mgb-* definidas no CSS.
                -->
                <span class="modal-guarnicoes" id="modal-guarnicoes"></span>
            </div>

            <div class="modal-footer">
                <button class="btn-modal-opo"    id="btn-modal-opo"  onclick="abrirOPO()">📄 Abrir OPO</button>
                <button class="btn-modal-fechar" onclick="fecharModal()">✕ Fechar</button>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <h4>Seção de Planejamento, Instrução e Estatística - P3/10ºBPM</h4>
        </div>
    <div style="position:fixed;bottom:6px;right:10px;font-size:.65rem;opacity:.5;color:inherit;z-index:1;pointer-events:none;">Criado por 1º Tenente Calheiros</div>
    </footer>

<script>
    let WEB_APP_URL = null; // definido em runtime a partir da unidade do usuário logado (ver js/core/session.js)

    let eventoAtualId = null;

    // Converte DATA para AAAA-MM-DD de forma tolerante — o Apps Script pode
    // devolver a data já em ISO, no formato BR (DD/MM/AAAA) ou até um valor
    // que o Date() nativo consegue interpretar. Antes, um simples split('/')
    // fazia os eventos "sumirem" do calendário sempre que a planilha trazia
    // a data em um formato diferente do esperado (FullCalendar ignora
    // silenciosamente qualquer evento com "start" inválido).
    function paraDataISO(valor) {
        if (!valor) return null;
        const s = String(valor).trim();

        const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (mIso) return `${mIso[1]}-${mIso[2]}-${mIso[3]}`;

        const mBr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (mBr) return `${mBr[3]}-${mBr[2].padStart(2, '0')}-${mBr[1].padStart(2, '0')}`;

        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        }
        return null;
    }

    // ── Modal ──────────────────────────────────────────────────
    function fecharModal() {
        document.getElementById('modal-evento').classList.remove('ativo');
        eventoAtualId = null;
    }

    function abrirOPO() {
        if (eventoAtualId) {
            window.open(`../relatorios/gerar_opo.html?id=${eventoAtualId}`, '_blank');
        }
    }

    /*
     * CORREÇÃO (Problema 3): abrirModal agora renderiza corretamente:
     *   - Título sem o prefixo de horário
     *   - Badges de guarnição usando as classes .mgb-*
     *   - Todos os campos preenchidos, incluindo viaturas
     */
    function abrirModal(eventInfo) {
        const props = eventInfo.event.extendedProps;
        eventoAtualId = eventInfo.event.id;

        // Remove o prefixo "HH:MM - " do título para exibição no modal
        const tituloLimpo = (eventInfo.event.title || '').replace(/^\S+\s-\s/, '');
        document.getElementById('modal-titulo').textContent = tituloLimpo || 'Evento';

        document.getElementById('modal-data').textContent       = props.dataFormatada || '—';
        document.getElementById('modal-local').textContent      = props.local         || '—';
        document.getElementById('modal-cidade').textContent     = props.cidade        || '—';
        document.getElementById('modal-organizacao').textContent= props.organizacao   || '—';
        document.getElementById('modal-responsavel').textContent= props.responsavel   || '—';
        document.getElementById('modal-telefone').textContent   = props.telefone      || '—';
        document.getElementById('modal-viaturas').textContent   =
            props.viaturas ? props.viaturas + ' viatura(s)' : '—';
        document.getElementById('modal-publico').textContent    =
            props.publico  ? props.publico + ' pessoas'     : '—';

        // Horário
        document.getElementById('modal-horario').textContent =
            props.horarioInicio
                ? props.horarioInicio + (props.horarioTermino ? ' até ' + props.horarioTermino : '')
                : '—';

        // Guarnições com badges coloridos
        const guarEl = document.getElementById('modal-guarnicoes');
        guarEl.innerHTML = '';
        const guarnicoes = (props.guarnicoes || '').split(',').map(g => g.trim()).filter(Boolean);

        if (guarnicoes.length === 0) {
            guarEl.innerHTML = '<span style="color:#999">Não definidas</span>';
        } else {
            guarnicoes.forEach(g => {
                const span       = document.createElement('span');
                span.textContent = g;
                // Usa a mesma convenção de classe .mgb-{nome} do CSS
                span.className   = 'modal-guarnicao-badge mgb-' + g.toLowerCase();
                guarEl.appendChild(span);
            });
        }

        document.getElementById('modal-evento').classList.add('ativo');
    }

    // ── FullCalendar ───────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        if (!P3.requireAuth()) return;

        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'pt-br',
            initialView: 'dayGridMonth',
            headerToolbar: {
                left:   'prev,next today',
                center: 'title',
                right:  'dayGridMonth,timeGridWeek,listMonth'
            },

            // Carrega eventos da planilha
            events: async function (info, successCallback, failureCallback) {
                try {
                    const cfg = await P3.loadUnidadeConfig();
                    WEB_APP_URL = cfg.gas.EVENTOS;
                    const response = await fetch(WEB_APP_URL + '?action=read', {
                        method: 'GET', mode: 'cors', redirect: 'follow'
                    });
                    const data = await response.json();

                    if (!Array.isArray(data)) {
                        console.error('Resposta inesperada do Apps Script de Eventos (esperava uma lista):', data);
                        successCallback([]);
                        return;
                    }

                    let ignorados = 0;
                    const events = data.map(item => {
                        const dataIso = paraDataISO(item.DATA);
                        if (!dataIso) { ignorados++; return null; }

                        // Cor do evento por porte (baseado no público estimado)
                        const publico = parseInt(item['ESTIMATIVA DE PÚBLICO']) || 0;
                        let classe = 'event-pequeno';
                        if (publico > 500 && publico <= 1000) classe = 'event-medio';
                        if (publico > 1000)                   classe = 'event-grande';

                        /*
                         * CORREÇÃO (Problema 3 - Calendário):
                         * Pré-gera o HTML dos badges de guarnição para uso no
                         * eventContent. Usa as classes .cal-guarnicao .cal-{nome}.
                         */
                        const guarnicoesList = (item['GUARNICOES'] || '')
                            .split(',').map(g => g.trim()).filter(Boolean);

                        const guarHtml = guarnicoesList.map(g =>
                            `<span class="cal-guarnicao cal-${g.toLowerCase()}">${g}</span>`
                        ).join('');

                        return {
                            id:        item.ID,
                            title:     `${item['HORÁRIO DE INÍCIO'] || ''} - ${item['NOME DO EVENTO'] || ''} - ${item['CIDADE'] || ''}`,
                            start:     dataIso,
                            className: classe,
                            extendedProps: {
                                cidade:        item.CIDADE,
                                local:         item['LOCAL DO EVENTO'],
                                dataFormatada: item.DATA,
                                horarioInicio: item['HORÁRIO DE INÍCIO'],
                                horarioTermino:item['HORÁRIO DE TÉRMINO'],
                                publico:       item['ESTIMATIVA DE PÚBLICO'],
                                organizacao:   item['ORGANIZAÇÃO'],
                                responsavel:   item['NOME DO RESPONSÁVEL'],
                                telefone:      item.TELEFONE,
                                guarnicoes:    item['GUARNICOES'] || '',
                                guarHtml:      guarHtml,           // ← HTML pré-gerado
                                viaturas:      item['VIATURAS'] || ''
                            }
                        };
                    });

                    if (ignorados > 0) {
                        console.warn(`Calendário: ${ignorados} evento(s) ignorado(s) por data inválida/irreconhecível.`);
                    }
                    successCallback(events.filter(Boolean));
                } catch (err) {
                    console.error('Erro ao carregar calendário:', err);
                    failureCallback(err);
                }
            },

            /*
             * CORREÇÃO (Problema 3 - eventContent):
             * Renderiza o título do evento + badges de guarnição lado a lado.
             * O FullCalendar aceita { html: '...' } para conteúdo customizado.
             */
            eventContent: function (arg) {
                const guarHtml = arg.event.extendedProps.guarHtml || '';

                return {
                    html: `
                        <div class="fc-event-inner">
                            <span class="fc-event-hora">${arg.event.extendedProps.horarioInicio || ''}</span>
                            <span class="fc-event-nome">${(arg.event.extendedProps.nomeEvento || arg.event.title.replace(/^\S+\s-\s/, ''))}</span>
                            ${guarHtml ? `<div class="fc-event-guarnicoes">${guarHtml}</div>` : ''}
                        </div>
                    `
                };
            },

            // Abre modal ao clicar no evento
            eventClick: function (info) {
                abrirModal(info);
            }
        });

        calendar.render();

        // Relógio, "Bem-vindo(a)" e botão Sair já são centralizados por
        // js/core/header-nav.js.

        // Fecha modal com ESC
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') fecharModal();
        });
    });
</script>
</body>
</html>
