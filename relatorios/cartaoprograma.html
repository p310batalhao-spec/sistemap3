<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento P3 - Gerador de Cartão Programa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/jurimetria.css">
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        /* Estilo para o botão de imprimir no ecrã */
        #btn-imprimir {
            display: none;
            /* Inicia escondido, o gerarcartao.js vai mostrar */
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        #btn-imprimir:hover {
            background-color: #218838;
        }

        #btn-salvar-cartao {
            display: none;
            /* Inicia escondido, o gerarcartao.js vai mostrar */
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-left: 8px;
        }

        #btn-salvar-cartao:hover {
            background-color: #002244;
        }

        #btn-salvar-cartao:disabled {
            opacity: .7;
            cursor: default;
        }

        /* LÓGICA DE IMPRESSÃO - FOCO APENAS NO CARTÃO */
        @media print {

            /* 1. Esconde tudo da página */
            body * {
                visibility: hidden;
            }

            /* 2. Torna o container do cartão e os seus filhos visíveis */
            #iframe-container,
            #iframe-container * {
                visibility: visible;
            }

            /* 3. Posiciona o cartão no topo da folha A4 */
            #iframe-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                border: none !important;
            }

            /* Esconde explicitamente elementos que podem causar páginas em branco */
            header,
            .sidebar,
            .menu-lateral,
            .filtros,
            #btn-imprimir,
            .header-info-left {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <script src="../js/core/session.js"></script>
    <script src="../js/core/header-nav.js" data-active="solucoesia"></script>

    <section class="pagecomplete">

        <main class="conteudo">
            <div class="container-central">
                <h2>Gerador de Cartão Programa</h2>

                <div id="controls-container" style="text-align: center; margin: 20px;">
                    <select id="select-rp" class="select-p3" style="padding: 12px; border-radius: 8px; width: 300px;">
                        <option value="">-- SELECIONE A GUARNIÇÃO --</option>
                        <option value="PALMEIRA DOS ÍNDIOS (RP 01)">PALMEIRA (RP 01)</option>
                        <option value="PALMEIRA DOS ÍNDIOS (RP 02)">PALMEIRA (RP 02)</option>
                        <option value="BELÉM (RP)">BELEM (RP)</option>
                        <option value="CACIMBINHAS (RP)">CACIMBINHAS (RP)</option>
                        <option value="MINADOR DO NEGRÃO (RP)">MINADOR DO NEGRÃO (RP)</option>
                        <option value="MAR VERMELHO (RP)">MAR VERMELHO (RP)</option>
                        <option value="PAULO JACINTO (RP)">PAULO JACINTO (RP)</option>
                        <option value="TANQUE D'ARCA (RP)">TANQUE D'ARCA (RP)</option>
                        <option value="MARIBONDO (RP)">MARIBONDO (RP)</option>
                        <option value="ESTRELA DE ALAGOAS (RP)">ESTRELA (RP)</option>
                        <option value="IGACI (RP)">IGACI (RP)</option>
                        <option value="QUEBRANGULO (RP)">QUEBRANGULO (RP)</option>
                        <option value="TÁTICO URBANO">TÁTICO URBANO</option>
                        <option value="TÁTICO RURAL 01">TÁTICO RURAL 01 (Maribondo)</option>
                        <option value="TÁTICO RURAL 02">TÁTICO RURAL 02 (Igaci)</option>
                    </select>

                    <button onclick="clicarBotaoGerar()" class="btn-primary"
                        style="padding: 12px 25px; cursor: pointer; border-radius: 8px; background-color: #007bff; margin-left: 10px;">
                        GERAR CARTÃO
                    </button>

                    <button id="btn-imprimir">IMPRIMIR CARTÃO</button>
                    <label id="label-perimetro-cartao" for="input-perimetro-cartao" style="display:none;margin-left:10px;">
                        Perímetro (km):
                        <input type="number" id="input-perimetro-cartao" value="1" min="0.3" step="0.1"
                            title="Raio de tolerância (em km) usado depois pra checar se a viatura passou perto o suficiente de cada local do cronograma — aumente se o cumprimento estiver dando 100% de falha por engano."
                            style="width:70px;padding:6px;border-radius:6px;">
                    </label>
                    <button id="btn-salvar-cartao">💾 SALVAR CARTÃO</button>
                </div>

                <div id="iframe-container"
                    style="display:none; background: white; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                </div>
            </div>
        </main>
    </section>
    <footer>
        <div>
            <h4>Seção de Planejamento, Instrução e Estatística - P3/10ºBPM</h4>
        </div>
    <div style="position:fixed;bottom:6px;right:10px;font-size:.65rem;opacity:.5;color:inherit;z-index:1;pointer-events:none;">Criado por 1º Tenente Calheiros</div>
    </footer>

    <script src="../js/cumprimento-core.js"></script>
    <script src="../js/gerarcartao.js"></script>

    <script>
        // Relógio, user-info e logout já são centralizados por
        // js/core/header-nav.js — aqui só falta a guarda de autenticação.
        document.addEventListener('DOMContentLoaded', function () {
            if (!P3.requireAuth()) return;

            // Adiciona função de impressão ao botão
            document.getElementById('btn-imprimir').addEventListener('click', () => {
                window.print();
            });

            document.getElementById('btn-salvar-cartao').addEventListener('click', () => {
                salvarCartaoAtual();
            });
        });
    </script>
</body>

</html>
