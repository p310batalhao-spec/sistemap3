<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Analítico — P3 / 10º BPM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        /* ═══════════════════════════════════════════════════════════
           RESET / BASE
           ═══════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #eef1f8; color: #1a1f36; }

        #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-size: 1rem; color: #555; gap: .75rem; text-align: center; }
        .spinner { width: 34px; height: 34px; border: 3px solid #dde3f0; border-top-color: #0a448f; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══════════════════════════════════════════════════════════
           BARRA DE AÇÕES (não imprime)
           ═══════════════════════════════════════════════════════════ */
        .acoes-topo {
            position: sticky; top: 0; z-index: 500;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem;
            background: #fff; padding: .7rem 1.25rem; box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        .modo-toggle { display: flex; background: #eef1f8; border-radius: 8px; padding: 3px; gap: 3px; }
        .modo-btn {
            border: none; background: transparent; padding: .5rem 1.1rem; border-radius: 6px;
            font-size: .85rem; font-weight: bold; color: #6b7594; cursor: pointer; transition: all .15s;
            display: flex; align-items: center; gap: .4rem;
        }
        .modo-btn.ativo { background: #0a448f; color: #fff; box-shadow: 0 2px 6px rgba(10,68,143,.3); }
        .acoes-dir { display: flex; gap: .6rem; }
        .acoes-dir button {
            padding: .55rem 1.1rem; border-radius: 8px; border: none; cursor: pointer;
            font-size: .85rem; font-weight: bold; display: flex; align-items: center; gap: .5rem;
        }
        .btn-fechar2 { background: #e8ecf5; color: #374263; }
        .btn-imprimir2 { background: #0a448f; color: #fff; }

        /* ═══════════════════════════════════════════════════════════
           MODO RETRATO — documento tradicional, seções empilhadas
           ═══════════════════════════════════════════════════════════ */
        #modo-retrato { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

        .capa {
            background: linear-gradient(135deg, #0a1f4d 0%, #1a3a6e 60%, #0d2a5c 100%);
            border-radius: 12px; padding: 2.25rem 2rem; color: #fff; margin-bottom: 1.5rem;
        }
        .capa-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; }
        .capa-header img { height: 60px; }
        .capa-org h1 { font-size: 1.1rem; font-weight: bold; letter-spacing: .05em; }
        .capa-org h2 { font-size: .85rem; opacity: .7; margin-top: .25rem; font-weight: normal; }
        .capa-titulo { border-top: 1px solid rgba(255,255,255,.25); padding-top: 1.1rem; margin-top: .9rem; }
        .capa-titulo h3 { font-size: 1.3rem; font-weight: bold; letter-spacing: .06em; }
        .capa-titulo p { font-size: .82rem; opacity: .65; margin-top: .35rem; }
        .capa-meta { display: flex; flex-wrap: wrap; gap: .55rem 1.4rem; margin-top: 1.15rem; font-size: .8rem; opacity: .78; }
        .capa-meta span { display: flex; align-items: center; gap: .4rem; }

        .secao { background: #fff; border-radius: 10px; padding: 1.6rem; margin-bottom: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); page-break-inside: avoid; }
        .secao-titulo { display: flex; align-items: flex-start; gap: .9rem; margin-bottom: 1.1rem; padding-bottom: .8rem; border-bottom: 2px solid #e8ecf5; }
        .secao-numero { width: 34px; height: 34px; border-radius: 50%; background: #0a448f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: bold; flex-shrink: 0; }
        .secao-titulo h2 { font-size: .96rem; font-weight: bold; color: #0a1f4d; }
        .secao-titulo p { font-size: .74rem; color: #9ea3b5; margin-top: .15rem; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
        .kpi { background: #f8f9ff; border-radius: 8px; padding: .85rem .9rem; border-top: 3px solid #0a448f; text-align: center; }
        .kpi-valor { font-size: 1.7rem; font-weight: bold; color: #1a1f36; line-height: 1.1; }
        .kpi-sub { font-size: .68rem; color: #9ea3b5; margin: .15rem 0; }
        .kpi-label { font-size: .68rem; font-weight: bold; color: #6b7594; text-transform: uppercase; letter-spacing: .04em; }

        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-bottom: .9rem; }
        .chart-row.tri { grid-template-columns: 1fr 1fr 1fr; }
        .chart-box { background: #f8f9ff; border-radius: 8px; padding: .9rem 1rem; }
        .chart-box-title { font-size: .78rem; font-weight: bold; color: #1a1f36; margin-bottom: .65rem; }
        .chart-wrapper { position: relative; height: 210px; }
        .chart-wrapper.tall { height: 280px; }

        .comentario { margin-top: .8rem; display: flex; flex-direction: column; gap: .5rem; }
        .insight { display: flex; align-items: flex-start; gap: .65rem; background: #f0f4ff; border-left: 3px solid #0a448f; border-radius: 6px; padding: .65rem .85rem; font-size: .8rem; line-height: 1.5; color: #374263; }
        .insight i { color: #0a448f; margin-top: 2px; flex-shrink: 0; }
        .insight.alerta { background: #fff3e0; border-left-color: #e65100; } .insight.alerta i { color: #e65100; }
        .insight.perigo { background: #ffebee; border-left-color: #b71c1c; } .insight.perigo i { color: #b71c1c; }
        .insight.ok { background: #e8f5e9; border-left-color: #2e7d32; } .insight.ok i { color: #2e7d32; }

        .tabela-rel { width: 100%; border-collapse: collapse; font-size: .74rem; margin-top: .5rem; }
        .tabela-rel th { background: #0a448f; color: #fff; font-weight: bold; padding: 7px 8px; text-align: left; white-space: nowrap; }
        .tabela-rel td { padding: 6px 8px; border-bottom: 1px solid #edf0f8; vertical-align: middle; }
        .tabela-rel tr:nth-child(even) td { background: #f8f9ff; }
        .badge-rel { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .68rem; font-weight: bold; }
        .badge-cvli { background: #ede9fe; color: #6a1b9a; }
        .badge-mvi { background: #ffebee; color: #b71c1c; }
        .obito-s { color: #b71c1c; font-weight: bold; } .obito-n { color: #9ea3b5; }

        .rodape { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: .5rem; border-top: 2px solid #e8ecf5; margin-top: 1.5rem; padding-top: .9rem; font-size: .72rem; color: #9ea3b5; line-height: 1.6; }

        /* ═══════════════════════════════════════════════════════════
           MODO SLIDES — um "slide" 16:9 por seção, estilo apresentação
           ═══════════════════════════════════════════════════════════ */
        #modo-slides { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        .slide {
            width: 100%; aspect-ratio: 16 / 9; background: #fff; border-radius: 10px;
            box-shadow: 0 8px 24px rgba(10,31,77,.18); overflow: hidden;
            display: flex; flex-direction: column; position: relative;
        }
        .slide-capa { background: linear-gradient(135deg, #0a1f4d 0%, #1a3a6e 55%, #0d2a5c 100%); color: #fff; align-items: center; justify-content: center; text-align: center; padding: 3rem; gap: 1rem; }
        .slide-capa img { height: 84px; margin-bottom: .5rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
        .slide-capa h1 { font-size: 1.9rem; letter-spacing: .06em; font-weight: 800; }
        .slide-capa h2 { font-size: 1rem; opacity: .75; font-weight: normal; margin-top: .4rem; }
        .slide-capa .slide-capa-titulo { font-size: 1.15rem; margin-top: 1.6rem; opacity: .92; border-top: 1px solid rgba(255,255,255,.25); padding-top: 1.2rem; letter-spacing: .04em; }
        .slide-capa .slide-capa-meta { margin-top: 1.4rem; display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: center; font-size: .8rem; opacity: .7; }

        .slide-header { display: flex; align-items: center; gap: .7rem; padding: 1.1rem 1.6rem .8rem; border-bottom: 2px solid #eef1f8; flex-shrink: 0; }
        .slide-header .slide-numero { width: 30px; height: 30px; border-radius: 50%; background: #0a448f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: bold; flex-shrink: 0; }
        .slide-header h2 { font-size: 1.05rem; font-weight: bold; color: #0a1f4d; }
        .slide-header p { font-size: .72rem; color: #9ea3b5; }
        .slide-body { flex: 1; padding: 1.1rem 1.6rem; overflow: hidden; display: flex; flex-direction: column; gap: .8rem; min-height: 0; }
        .slide-footer { padding: .5rem 1.6rem; font-size: .62rem; color: #b7bccb; display: flex; justify-content: space-between; flex-shrink: 0; }

        .slide-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: .6rem; flex-shrink: 0; }
        .slide-kpi { background: #f8f9ff; border-radius: 8px; padding: .6rem .5rem; border-top: 3px solid #0a448f; text-align: center; }
        .slide-kpi .kpi-valor { font-size: 1.3rem; }
        /* Chart.js precisa de uma altura EXPLÍCITA e delimitada em toda a
           cadeia de pais — height:100% dentro de um flex sem altura fixa
           faz o canvas entrar num loop de redimensionamento (ficava com
           900px de altura em vez de ~230px). Por isso .chart-row tem altura
           fixa aqui, e .chart-box vira flex column com o wrapper em flex:1
           + min-height:0 (a receita correta pro Chart.js num container flex). */
        .slide-body .chart-row { height: 230px; flex-shrink: 0; margin-bottom: 0; }
        .slide-body .chart-box { display: flex; flex-direction: column; height: 100%; }
        .slide-body .chart-wrapper { flex: 1; min-height: 0; height: auto; }
        .slide-body .comentario { flex-shrink: 0; }
        .slide-body .insight { font-size: .72rem; padding: .5rem .7rem; }
        .slide-fechamento { align-items: center; justify-content: center; text-align: center; gap: .6rem; background: linear-gradient(135deg, #0a1f4d 0%, #1a3a6e 100%); color: #fff; }
        .slide-fechamento i { font-size: 2.2rem; opacity: .85; }
        .slide-fechamento h2 { font-size: 1.3rem; }
        .slide-fechamento p { font-size: .82rem; opacity: .7; }

        /* ═══════════════════════════════════════════════════════════
           IMPRESSÃO
           ═══════════════════════════════════════════════════════════ */
        @media print {
            body { background: #fff; }
            .acoes-topo { display: none !important; }
            .secao { box-shadow: none; border: 1px solid #e8ecf5; page-break-inside: avoid; }
            .chart-wrapper { height: 170px; }
            .chart-wrapper.tall { height: 220px; }
            .slide { box-shadow: none; border: 1px solid #e2e8f0; page-break-after: always; aspect-ratio: auto; width: 100%; height: 100vh; }
            #modo-slides { gap: 0; padding: 0; }
        }
        @media (max-width: 720px) {
            .chart-row, .chart-row.tri { grid-template-columns: 1fr; }
            .slide { aspect-ratio: auto; }
        }
    </style>
</head>
<body>
<script src="../js/core/session.js"></script>

<div id="loader">
    <div class="spinner"></div>
    Carregando dados do relatório…
</div>

<div id="relatorio" style="display:none;">
    <div class="acoes-topo">
        <div class="modo-toggle">
            <button id="btn-modo-retrato" class="modo-btn ativo" onclick="mudarModo('retrato')"><i class="fas fa-file-lines"></i> Retrato (PDF)</button>
            <button id="btn-modo-slides" class="modo-btn" onclick="mudarModo('slides')"><i class="fas fa-display"></i> Slides (Apresentação)</button>
        </div>
        <div class="acoes-dir">
            <button class="btn-fechar2" onclick="window.close()"><i class="fas fa-xmark"></i> Fechar</button>
            <button class="btn-imprimir2" onclick="window.print()"><i class="fas fa-print"></i> Imprimir / Salvar PDF</button>
        </div>
    </div>

    <div id="modo-retrato"></div>
    <div id="modo-slides" style="display:none;"></div>
</div>

<script src="../js/relatorio_p3.js"></script>
</body>
</html>
