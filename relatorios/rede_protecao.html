<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rede de Proteção — 10º BPM</title>
<!--
    Aberta no NAVEGADOR PADRÃO a partir do app desktop (.exe) pela aba
    "Rede de Proteção / Grupos Vulneráveis" (js/dashboard-rede-protecao.js).
    O WebView2 do .exe bloqueia pop-up por script e download de arquivo, então
    o conteúdo vem do servidor local: GET http://localhost:5057/relatorio/obter
    ?token=… (ver tools/atualizador-local/app.py). O token vale UMA vez.
      tipo "impressao"    → { html }                    — relatório pronto pra imprimir/salvar em PDF
      tipo "apresentacao" → { nome, pptxBase64, titulo? } — PowerPoint (Rede de Proteção ou Indicadores do Dashboard Cruzado): pré-visualiza e baixa
-->
<style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #1d1028; color: #fff; }
    .barra { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: 14px 24px; background: #531c7e; }
    .barra h1 { font-size: 1rem; margin: 0; flex: 1; min-width: 240px; }
    .barra small { display: block; font-weight: normal; opacity: .75; font-size: .75rem; margin-top: 2px; }
    .barra button { padding: .55rem 1.1rem; border: none; border-radius: 7px; background: #ca247a; color: #fff; font-weight: bold; font-size: .85rem; cursor: pointer; }
    #palco { display: flex; justify-content: center; padding: 20px 16px 40px; }
    #palco span, #palco p, #palco div { font-family: Aptos, "Segoe UI", Calibri, Arial, sans-serif !important; }
    .pronto { max-width: 640px; margin: 40px auto; background: #fff; color: #1c2333; border-radius: 16px; padding: 2.2rem 2.4rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); text-align: center; }
    .pronto-icone { font-size: 2.6rem; }
    .pronto h2 { margin: .4rem 0 .2rem; color: #0b2545; font-size: 1.5rem; }
    .pronto-sub { color: #6b7280; margin: 0 0 1.2rem; font-size: .9rem; }
    .pronto-btn { padding: .8rem 1.6rem; border: none; border-radius: 10px; background: #2f5fdd; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .pronto-aviso { color: #6b7280; font-size: .82rem; margin: .8rem 0 0; }
    .pronto h3 { text-align: left; color: #0b2545; font-size: .95rem; margin: 1.6rem 0 .5rem; border-top: 1px solid #e6eaf2; padding-top: 1rem; }
    .pronto ol { list-style: none; padding: 0; margin: 0; text-align: left; columns: 2; column-gap: 1.5rem; font-size: .86rem; }
    .pronto li { padding: .28rem 0; break-inside: avoid; }
    .pronto li span { display: inline-block; width: 1.8rem; color: #2f5fdd; font-weight: bold; }
    .msg { max-width: 640px; margin: 60px auto; background: #fff; color: #333; border-radius: 10px; padding: 2rem; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="conteudo"><div class="msg">⏳ Carregando…</div></div>
<script>
(async function () {
    const cont = document.getElementById('conteudo');
    const msg = t => { cont.innerHTML = '<div class="msg">' + t + '</div>'; };
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const q = new URLSearchParams(location.search);
    const token = q.get('token');               // via servidor local do .exe (127.0.0.1:5057)
    const fb = q.get('fb'), db = q.get('db');   // via Firebase da unidade (nó temporário /relay_temp)
    if (!token && !(fb && db)) { msg('Link incompleto. Gere de novo pelo sistema.'); return; }

    let dados;
    try {
        if (token) {
            const r = await fetch('http://localhost:5057/relatorio/obter?token=' + encodeURIComponent(token));
            if (!r.ok) throw new Error('não encontrado ou expirado');
            dados = await r.json();
        } else {
            if (!/^https:\/\/[a-z0-9-]+(-default-rtdb)?\.[a-z0-9.-]*firebase(io|database)\.(com|app)$/i.test(db)) throw new Error('endereço de dados inválido');
            const url = `${db}/relay_temp/${encodeURIComponent(fb)}.json`;
            const r = await fetch(url);
            const reg = r.ok ? await r.json() : null;
            if (!reg || !reg.conteudo) throw new Error('não encontrado ou já utilizado');
            // Não apaga aqui: a página pode abrir mais de uma vez no .exe. O próprio sistema
            // remove os registros com mais de 30 min a cada novo envio.
            dados = JSON.parse(reg.conteudo);
        }
    } catch (e) {
        msg('Não foi possível carregar (' + e.message + ').<br>O link vale por cerca de 30 minutos. Gere de novo pelo sistema.');
        return;
    }

    if (dados.tipo === 'impressao') {
        // Já traz o próprio window.print() no onload.
        document.open(); document.write(dados.html); document.close();
        return;
    }

    if (dados.tipo !== 'apresentacao' || !dados.pptxBase64) { msg('Conteúdo desconhecido.'); return; }

    const bin = atob(dados.pptxBase64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    const nome = dados.nome || 'Rede_Protecao.pptx';
    const baixar = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };

    document.title = nome.replace(/\.pptx$/i, '');
    cont.innerHTML = '<div class="barra"><h1>' + esc(dados.titulo || 'Apresentação — modelo padronizado da Rede de Proteção') +
        '<small>' + (dados.semPrevia ? 'Arquivo pronto para salvar — abre completo e editável no PowerPoint.' : 'Pré-visualização aproximada; o arquivo baixado abre completo e editável no PowerPoint.') + '</small></h1>' +
        '<button id="btn-baixar">⬇ Salvar em PowerPoint (.pptx)</button></div><div id="palco"></div>';
    document.getElementById('btn-baixar').addEventListener('click', baixar);

    const mostrarSumario = (aviso) => {
        const itens = (dados.sumario || []).map((t, i) => `<li><span>${String(i + 1).padStart(2, '0')}</span>${esc(t)}</li>`).join('');
        document.getElementById('palco').innerHTML = `<div class="pronto">
            <div class="pronto-icone">✅</div>
            <h2>Apresentação pronta</h2>
            ${dados.periodo ? `<p class="pronto-sub">${esc(dados.periodo)}</p>` : ''}
            <button class="pronto-btn" id="btn-baixar2">⬇ Salvar em PowerPoint (.pptx)</button>
            ${aviso ? `<p class="pronto-aviso">${aviso}</p>` : ''}
            ${itens ? `<h3>${(dados.sumario || []).length} slides</h3><ol>${itens}</ol>` : ''}
        </div>`;
        document.getElementById('btn-baixar2').addEventListener('click', baixar);
    };
    if (dados.semPrevia) { mostrarSumario('Abra o arquivo no PowerPoint para ver os slides com gráficos editáveis.'); return; }

    try {
        await new Promise((ok, falha) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/dist/pptx-preview.umd.js';
            s.onload = ok; s.onerror = () => falha(new Error('sem acesso à biblioteca de pré-visualização'));
            document.head.appendChild(s);
        });
        const largura = Math.min(1100, window.innerWidth - 48);
        const prev = window.pptxPreview.init(document.getElementById('palco'), { width: largura, height: Math.round(largura * 9 / 16), mode: 'slide' });
        await prev.preview(await blob.arrayBuffer());
    } catch (e) {
        console.warn('pré-visualização indisponível:', e);
        mostrarSumario('A pré-visualização no navegador não está disponível para este arquivo — abra-o no PowerPoint.');
    }
})();
</script>
</body>
</html>
